<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="tl11b" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker>
    <marker id="tl11g" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#27ae60"/></marker>
    <marker id="tl11r" markerWidth="9" markerHeight="9" refX="5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/></marker>
  </defs>

  <text x="410" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a" direction="rtl">Transfer Learning — הרעיון שמאחורי Hugging Face</text>
  <text x="410" y="53" text-anchor="middle" font-size="12.5" fill="#475569" direction="rtl">מודל שאומן על דאטה ענק (Task A) מותאם למשימה שלך עם מעט דאטה (Task B)</text>

  <!-- Task A -->
  <rect x="130" y="92" width="180" height="56" rx="8" fill="#bfdbfe" stroke="#2563eb"/>
  <text x="220" y="116" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e3a8a">Task A</text>
  <text x="220" y="136" text-anchor="middle" font-size="11" fill="#1e3a8a" direction="rtl">(דאטהסט ענק)</text>

  <!-- arrow up A -->
  <line x1="220" y1="190" x2="220" y2="152" stroke="#2563eb" stroke-width="2.4" marker-end="url(#tl11b)"/>

  <!-- Model A -->
  <rect x="130" y="194" width="180" height="110" rx="10" fill="#2563eb"/>
  <text x="220" y="244" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Model A</text>
  <text x="220" y="266" text-anchor="middle" font-size="10.5" fill="#dbeafe" direction="rtl">אומן מראש (pretrained)</text>
  <text x="220" y="282" text-anchor="middle" font-size="10.5" fill="#dbeafe">BERT · GPT · ViT...</text>

  <!-- Task B -->
  <rect x="510" y="92" width="180" height="56" rx="8" fill="#bbf7d0" stroke="#27ae60"/>
  <text x="600" y="116" text-anchor="middle" font-size="13.5" font-weight="700" fill="#166534">Task B</text>
  <text x="600" y="136" text-anchor="middle" font-size="11" fill="#166534" direction="rtl">(דאטהסט קטן — שלך)</text>

  <!-- arrow up B -->
  <line x1="600" y1="190" x2="600" y2="152" stroke="#27ae60" stroke-width="2.4" marker-end="url(#tl11g)"/>

  <!-- Model B -->
  <rect x="510" y="194" width="180" height="110" rx="10" fill="#27ae60"/>
  <text x="600" y="244" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Model B</text>
  <text x="600" y="266" text-anchor="middle" font-size="10.5" fill="#dcfce7" direction="rtl">עבר fine-tuning</text>
  <text x="600" y="282" text-anchor="middle" font-size="10.5" fill="#dcfce7" direction="rtl">למשימה שלך</text>

  <!-- red transfer arrow -->
  <line x1="320" y1="249" x2="500" y2="249" stroke="#dc2626" stroke-width="5" marker-end="url(#tl11r)"/>
  <text x="410" y="232" text-anchor="middle" font-size="13.5" font-weight="700" fill="#dc2626" direction="rtl">Transfer Learning</text>
  <text x="410" y="278" text-anchor="middle" font-size="10.5" fill="#dc2626" direction="rtl">מעבירים את המשקלים</text>

  <text x="410" y="338" text-anchor="middle" font-size="11.5" fill="#475569" direction="rtl">חוסך זמן, דאטה, וטביעת רגל פחמנית — לא מאמנים from-scratch אלא ()from_pretrained</text>
</svg>
