<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 430" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="tk11" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker>
  </defs>

  <text x="370" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a" direction="rtl">שלב 1: Tokenization — מטקסט למספרים</text>
  <text x="370" y="49" text-anchor="middle" font-size="12" fill="#475569" direction="rtl">ה-tokenizer ממיר כל מילה למזהה, מוסיף אסימוני מסגרת, ומרפד לאורך אחיד</text>

  <!-- raw inputs -->
  <rect x="150" y="64" width="440" height="56" rx="9" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="370" y="86" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#0f172a">"I love learning deep-learning"</text>
  <text x="370" y="108" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#0f172a">"I hate doing homework"</text>

  <line x1="370" y1="120" x2="370" y2="150" stroke="#2563eb" stroke-width="2.2" marker-end="url(#tk11)"/>
  <text x="385" y="140" text-anchor="start" font-family="Consolas, monospace" font-size="10.5" fill="#2563eb">tokenizer(padding=True, truncation=True)</text>

  <!-- input_ids label -->
  <text x="352" y="170" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a" direction="rtl">input_ids — מזהה מספרי לכל token</text>

  <!-- input_ids matrix -->
  <g font-family="Consolas, monospace" font-size="12.5" text-anchor="middle">
    <!-- row 1 -->
    <g>
      <rect x="130" y="178" width="52" height="30" rx="5" fill="#1e3a8a"/><text x="156" y="198" fill="#fff">101</text>
      <rect x="186" y="178" width="52" height="30" rx="5" fill="#dbeafe" stroke="#2563eb"/><text x="212" y="198" fill="#0f172a">1045</text>
      <rect x="242" y="178" width="52" height="30" rx="5" fill="#dbeafe" stroke="#2563eb"/><text x="268" y="198" fill="#0f172a">2293</text>
      <rect x="298" y="178" width="52" height="30" rx="5" fill="#dbeafe" stroke="#2563eb"/><text x="324" y="198" fill="#0f172a">4083</text>
      <rect x="354" y="178" width="52" height="30" rx="5" fill="#dbeafe" stroke="#2563eb"/><text x="380" y="198" fill="#0f172a">2784</text>
      <rect x="410" y="178" width="52" height="30" rx="5" fill="#dbeafe" stroke="#2563eb"/><text x="436" y="198" fill="#0f172a">1011</text>
