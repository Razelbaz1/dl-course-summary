      <rect x="522" y="178" width="52" height="30" rx="5" fill="#1e3a8a"/><text x="548" y="198" fill="#fff">102</text>
    </g>
    <!-- row 2 -->
    <g>
      <rect x="130" y="210" width="52" height="30" rx="5" fill="#1e3a8a"/><text x="156" y="230" fill="#fff">101</text>
      <rect x="186" y="210" width="52" height="30" rx="5" fill="#dbeafe" stroke="#2563eb"/><text x="212" y="230" fill="#0f172a">1045</text>
      <rect x="242" y="210" width="52" height="30" rx="5" fill="#dbeafe" stroke="#2563eb"/><text x="268" y="230" fill="#0f172a">5223</text>
      <rect x="298" y="210" width="52" height="30" rx="5" fill="#dbeafe" stroke="#2563eb"/><text x="324" y="230" fill="#0f172a">2725</text>
      <rect x="354" y="210" width="52" height="30" rx="5" fill="#dbeafe" stroke="#2563eb"/><text x="380" y="230" fill="#0f172a">19453</text>
      <rect x="410" y="210" width="52" height="30" rx="5" fill="#1e3a8a"/><text x="436" y="230" fill="#fff">102</text>
      <rect x="466" y="210" width="52" height="30" rx="5" fill="#f8fafc" stroke="#d35400" stroke-dasharray="3,2"/><text x="492" y="230" fill="#d35400">0</text>
      <rect x="522" y="210" width="52" height="30" rx="5" fill="#f8fafc" stroke="#d35400" stroke-dasharray="3,2"/><text x="548" y="230" fill="#d35400">0</text>
    </g>
  </g>

  <!-- attention_mask label -->
  <text x="352" y="288" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a" direction="rtl">attention_mask — 1=מילה אמיתית · 0=ריפוד (התעלם)</text>

  <!-- attention_mask matrix -->
  <g font-family="Consolas, monospace" font-size="12.5" text-anchor="middle" fill="#0f172a">
    <g>
      <rect x="130" y="296" width="52" height="28" rx="5" fill="#dcfce7" stroke="#27ae60"/><text x="156" y="315">1</text>
      <rect x="186" y="296" width="52" height="28" rx="5" fill="#dcfce7" stroke="#27ae60"/><text x="212" y="315">1</text>
      <rect x="242" y="296" width="52" height="28" rx="5" fill="#dcfce7" stroke="#27ae60"/><text x="268" y="315">1</text>
      <rect x="298" y="296" width="52" height="28" rx="5" fill="#dcfce7" stroke="#27ae60"/><text x="324" y="315">1</text>
      <rect x="354" y="296" width="52" height="28" rx="5" fill="#dcfce7" stroke="#27ae60"/><text x="380" y="315">1</text>
      <rect x="410" y="296" width="52" height="28" rx="5" fill="#dcfce7" stroke="#27ae60"/><text x="436" y="315">1</text>
      <rect x="466" y="296" width="52" height="28" rx="5" fill="#dcfce7" stroke="#27ae60"/><text x="492" y="315">1</text>
