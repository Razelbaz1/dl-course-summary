    </g>
    <g>
      <rect x="130" y="326" width="52" height="28" rx="5" fill="#dcfce7" stroke="#27ae60"/><text x="156" y="345">1</text>
      <rect x="186" y="326" width="52" height="28" rx="5" fill="#dcfce7" stroke="#27ae60"/><text x="212" y="345">1</text>
      <rect x="242" y="326" width="52" height="28" rx="5" fill="#dcfce7" stroke="#27ae60"/><text x="268" y="345">1</text>
      <rect x="298" y="326" width="52" height="28" rx="5" fill="#dcfce7" stroke="#27ae60"/><text x="324" y="345">1</text>
      <rect x="354" y="326" width="52" height="28" rx="5" fill="#dcfce7" stroke="#27ae60"/><text x="380" y="345">1</text>
      <rect x="410" y="326" width="52" height="28" rx="5" fill="#dcfce7" stroke="#27ae60"/><text x="436" y="345">1</text>
      <rect x="466" y="326" width="52" height="28" rx="5" fill="#fee2e2" stroke="#dc2626"/><text x="492" y="345" fill="#dc2626">0</text>
      <rect x="522" y="326" width="52" height="28" rx="5" fill="#fee2e2" stroke="#dc2626"/><text x="548" y="345" fill="#dc2626">0</text>
    </g>
  </g>

  <!-- legend -->
  <g font-size="11">
    <rect x="130" y="378" width="16" height="16" rx="3" fill="#1e3a8a"/>
    <text x="152" y="390" text-anchor="start" fill="#475569">101=[CLS] · 102=[SEP]</text>
    <rect x="320" y="378" width="16" height="16" rx="3" fill="#f8fafc" stroke="#d35400" stroke-dasharray="3,2"/>
    <text x="342" y="390" text-anchor="start" fill="#475569" direction="rtl">0 = ריפוד (padding)</text>
    <rect x="520" y="378" width="16" height="16" rx="3" fill="#fee2e2" stroke="#dc2626"/>
    <text x="542" y="390" text-anchor="start" fill="#475569" direction="rtl">mask=0 → המודל מתעלם</text>
  </g>
  <text x="370" y="418" text-anchor="middle" font-size="11" fill="#94a3b8" direction="rtl">המשפט הקצר רופד ב-0 כדי להשתוות באורך למשפט הארוך — וה-mask מסמן זאת</text>
</svg>
