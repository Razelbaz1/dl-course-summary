<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" font-family="Segoe UI, Arial, sans-serif">
  <text x="460" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#1f3a68">VGG16 — הארכיטקטורה הקלאסית של Simonyan &amp; Zisserman (2014)</text>
  <text x="460" y="46" text-anchor="middle" font-size="13" fill="#6b7280">‎13 שכבות Conv2D + 5 MaxPool. סה"כ 138M פרמטרים · מתוכם 14.7M ב-conv_base (include_top=False)</text>

  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Input -->
  <g>
    <rect x="20" y="190" width="60" height="70" fill="#e0e7ff" stroke="#1f3a68" stroke-width="2" rx="4"/>
    <text x="50" y="215" text-anchor="middle" font-size="11" font-weight="700" fill="#1f3a68">Input</text>
    <text x="50" y="232" text-anchor="middle" font-size="10" fill="#1f3a68">180×180</text>
    <text x="50" y="246" text-anchor="middle" font-size="10" fill="#1f3a68">×3</text>
  </g>

  <!-- Block 1: 2 conv 64, pool -->
  <g>
    <rect x="90" y="180" width="100" height="90" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" rx="4"/>
    <text x="140" y="200" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">Block 1</text>
    <text x="140" y="218" text-anchor="middle" font-size="10" fill="#166534">2 × Conv2D 64</text>
    <text x="140" y="234" text-anchor="middle" font-size="10" fill="#166534">+ MaxPool 2×2</text>
    <text x="140" y="258" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">90×90×64</text>
  </g>

  <!-- Block 2: 2 conv 128, pool -->
  <g>
    <rect x="200" y="180" width="100" height="90" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5" rx="4"/>
    <text x="250" y="200" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">Block 2</text>
    <text x="250" y="218" text-anchor="middle" font-size="10" fill="#166534">2 × Conv2D 128</text>
    <text x="250" y="234" text-anchor="middle" font-size="10" fill="#166534">+ MaxPool 2×2</text>
    <text x="250" y="258" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">45×45×128</text>
  </g>

  <!-- Block 3: 3 conv 256, pool -->
  <g>
    <rect x="310" y="180" width="100" height="90" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5" rx="4"/>
    <text x="360" y="200" text-anchor="middle" font-size="11" font-weight="700" fill="#854d0e">Block 3</text>
    <text x="360" y="218" text-anchor="middle" font-size="10" fill="#854d0e">3 × Conv2D 256</text>
    <text x="360" y="234" text-anchor="middle" font-size="10" fill="#854d0e">+ MaxPool 2×2</text>
    <text x="360" y="258" text-anchor="middle" font-size="11" font-weight="700" fill="#854d0e">22×22×256</text>
  </g>

  <!-- Block 4: 3 conv 512, pool -->
  <g>
    <rect x="420" y="180" width="100" height="90" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5" rx="4"/>
    <text x="470" y="200" text-anchor="middle" font-size="11" font-weight="700" fill="#9a3412">Block 4</text>
    <text x="470" y="218" text-anchor="middle" font-size="10" fill="#9a3412">3 × Conv2D 512</text>
    <text x="470" y="234" text-anchor="middle" font-size="10" fill="#9a3412">+ MaxPool 2×2</text>
    <text x="470" y="258" text-anchor="middle" font-size="11" font-weight="700" fill="#9a3412">11×11×512</text>
  </g>

  <!-- Block 5: 3 conv 512, pool -->
  <g>
    <rect x="530" y="180" width="100" height="90" fill="#fecaca" stroke="#dc2626" stroke-width="1.5" rx="4"/>
    <text x="580" y="200" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">Block 5</text>
    <text x="580" y="218" text-anchor="middle" font-size="10" fill="#991b1b">3 × Conv2D 512</text>
    <text x="580" y="234" text-anchor="middle" font-size="10" fill="#991b1b">+ MaxPool 2×2</text>
    <text x="580" y="258" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">5×5×512</text>
  </g>

  <!-- conv_base bracket -->
  <line x1="90" y1="285" x2="630" y2="285" stroke="#16a34a" stroke-width="2"/>
  <line x1="90" y1="285" x2="90" y2="295" stroke="#16a34a" stroke-width="2"/>
  <line x1="630" y1="285" x2="630" y2="295" stroke="#16a34a" stroke-width="2"/>
  <text x="360" y="305" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">conv_base ← include_top=False</text>
  <text x="360" y="320" text-anchor="middle" font-size="11" fill="#16a34a">14,714,688 params · feature extractor</text>

  <!-- Original FC -->
  <g>
    <rect x="650" y="170" width="100" height="110" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" rx="4" stroke-dasharray="5,3"/>
    <text x="700" y="190" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">FC head</text>
    <text x="700" y="206" text-anchor="middle" font-size="10" fill="#1e40af">Flatten</text>
    <text x="700" y="220" text-anchor="middle" font-size="10" fill="#1e40af">Dense 4096</text>
    <text x="700" y="234" text-anchor="middle" font-size="10" fill="#1e40af">Dense 4096</text>
    <text x="700" y="248" text-anchor="middle" font-size="10" fill="#1e40af">Dense 1000</text>
    <text x="700" y="265" text-anchor="middle" font-size="10" font-style="italic" fill="#6b7280">(ImageNet)</text>
  </g>
  <text x="700" y="305" text-anchor="middle" font-size="10" fill="#6b7280">123M params</text>
  <text x="700" y="320" text-anchor="middle" font-size="10" fill="#6b7280">→ נזרק אצלנו</text>

  <!-- Custom classifier -->
  <g>
    <rect x="770" y="170" width="130" height="110" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="4"/>
    <text x="835" y="190" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">Custom Head</text>
    <text x="835" y="206" text-anchor="middle" font-size="10" fill="#166534">Flatten</text>
    <text x="835" y="220" text-anchor="middle" font-size="10" fill="#166534">Dense 256</text>
    <text x="835" y="234" text-anchor="middle" font-size="10" fill="#166534">Dropout 0.5</text>
    <text x="835" y="248" text-anchor="middle" font-size="10" font-weight="700" fill="#166534">Dense 1 sigmoid</text>
    <text x="835" y="265" text-anchor="middle" font-size="10" font-style="italic" fill="#16a34a">(cats vs dogs)</text>
  </g>
  <text x="835" y="305" text-anchor="middle" font-size="10" font-weight="700" fill="#166534">‎3.3M params</text>
  <text x="835" y="320" text-anchor="middle" font-size="10" fill="#16a34a">→ הראש שאנחנו מאמנים</text>

  <!-- Connections -->
  <g stroke="#475569" stroke-width="1.5" fill="none">
    <!-- Sequential block-to-block arrows -->
    <line x1="80" y1="225" x2="90" y2="225" marker-end="url(#arr3)"/>
    <line x1="190" y1="225" x2="200" y2="225" marker-end="url(#arr3)"/>
    <line x1="300" y1="225" x2="310" y2="225" marker-end="url(#arr3)"/>
    <line x1="410" y1="225" x2="420" y2="225" marker-end="url(#arr3)"/>
    <line x1="520" y1="225" x2="530" y2="225" marker-end="url(#arr3)"/>
    <!-- Block 5 → FC head: dashed (original ImageNet path, abandoned) -->
    <line x1="630" y1="225" x2="650" y2="225" marker-end="url(#arr3)" stroke-dasharray="3,2"/>
    <!-- Block 5 → Custom Head: curve goes OVER the top (empty zone between callout and boxes) -->
    <path d="M 620 180 C 620 110 820 110 820 170" marker-end="url(#arr3)"/>
  </g>

  <!-- Curve label (above the curve apex, between top callout and boxes) -->
  <text x="720" y="160" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">המסלול בפועל</text>

  <!-- Note: what changes in each block (foreignObject — clean bidi via HTML) -->
  <foreignObject x="40" y="60" width="840" height="55">
    <div xmlns="http://www.w3.org/1999/xhtml" dir="rtl" style="box-sizing:border-box; width:100%; height:100%; padding:6px 14px; background:#f9fafb; border:1px solid #d1d5db; border-radius:6px; font-family:'Segoe UI', Arial, sans-serif; color:#374151; font-size:12px; line-height:1.5;">
      <div>📏 בכל בלוק קורים שני שינויים במקביל: <strong>MaxPool 2×2</strong> מצמצם את הגודל המרחבי בחצי, ו-<strong>Conv2D</strong> מכפיל את העומק (filters): 64 → 128 → 256 → 512 → 512.</div>
      <div>התוצאה: תמונה של 180×180×3 (97,200 ערכים) מתכווצת ל-feature tensor של 5×5×512 (12,800 ערכים) — דחיסה של התמונה לייצוג סמנטי.</div>
    </div>
  </foreignObject>

  <!-- Bottom: transfer learning breakdown (foreignObject) -->
  <foreignObject x="40" y="345" width="840" height="120">
    <div xmlns="http://www.w3.org/1999/xhtml" dir="rtl" style="box-sizing:border-box; width:100%; height:100%; padding:8px 14px; background:#fff7ed; border:1px solid #fb923c; border-radius:6px; font-family:'Segoe UI', Arial, sans-serif; color:#9a3412; font-size:11px; line-height:1.55;">
      <div style="font-size:12px; font-weight:700; margin-bottom:5px;">🔑 ‎Transfer Learning — 3 שלבים</div>
      <div><strong>1. טעינת המודל המאומן:</strong> משתמשים ב-<span dir="ltr" style="font-family:Consolas,monospace">VGG16(weights="imagenet", include_top=False)</span> כדי לקבל רק את ה-conv_base, ללא ה-FC head המקורי.</div>
      <div><strong>2. השלכת ה-FC head המקורי:</strong> המודל המקורי סיווג תמונות ל-1000 קטגוריות של ImageNet (סוגי כלבים, פירות, רכבים, …). הוא לא מתאים למשימה בינארית של cat/dog.</div>
      <div><strong>3. בניית head מותאם:</strong> רשת קטנה (Dense 256 → Dense 1 sigmoid) שמאומנת מאפס. ה-conv_base נשאר מוקפא, והמשקלים שלו לא משתנים באימון.</div>
      <div style="margin-top:4px; font-weight:700;">⚠ סדר חשוב: <span dir="ltr" style="font-family:Consolas,monospace">trainable=False</span> חייב לבוא <em>לפני</em> <span dir="ltr" style="font-family:Consolas,monospace">compile()</span>. אחרת ה-optimizer רושם את המשקלים כניתנים-לאימון, וההגדרה כבר לא תיכנס לתוקף.</div>
    </div>
  </foreignObject>
</svg>
