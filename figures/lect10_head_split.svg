<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="hsA" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#475569"/></marker>
  </defs>

  <text x="410" y="24" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a" direction="rtl">חיתוך מטריצת Q ל-4 ראשים</text>
  <text x="410" y="43" text-anchor="middle" font-size="12" fill="#475569" direction="rtl">שורה = מילה · עמודה = פיצ'ר · חותכים את הפיצ'רים ל-4 פרוסות של 128</text>

  <!-- top label: features split -->
  <text x="440" y="66" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e3a8a" direction="rtl">512 פיצ'רים (עמודות) ⇽ נחתכים ל-4</text>
  <g font-size="10" text-anchor="middle" fill="#475569">
    <text x="230" y="86">128</text><text x="370" y="86">128</text><text x="510" y="86">128</text><text x="650" y="86">128</text>
  </g>

  <!-- matrix bands (4 heads) -->
  <rect x="160" y="92" width="140" height="196" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="300" y="92" width="140" height="196" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="440" y="92" width="140" height="196" fill="#fff3d6" stroke="#d35400" stroke-width="1.5"/>
  <rect x="580" y="92" width="140" height="196" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>

  <!-- row separators (7 words) -->
  <g stroke="#94a3b8" stroke-width="0.7" opacity="0.6">
    <line x1="160" y1="120" x2="720" y2="120"/>
    <line x1="160" y1="148" x2="720" y2="148"/>
    <line x1="160" y1="176" x2="720" y2="176"/>
    <line x1="160" y1="204" x2="720" y2="204"/>
    <line x1="160" y1="232" x2="720" y2="232"/>
    <line x1="160" y1="260" x2="720" y2="260"/>
  </g>

  <!-- word labels (rows) on the left -->
  <g font-size="11" text-anchor="end" fill="#1e3a8a" font-weight="600">
    <text x="152" y="110">The</text>
    <text x="152" y="138">train</text>
    <text x="152" y="166">left</text>
    <text x="152" y="194">the</text>
    <text x="152" y="222">station</text>
    <text x="152" y="250">on</text>
    <text x="152" y="278">time</text>
  </g>
  <text x="120" y="190" text-anchor="middle" font-size="11" font-weight="700" fill="#475569" transform="rotate(-90 120 190)">7 מילים (שורות)</text>

  <!-- head labels (bottom) -->
  <g text-anchor="middle">
    <text x="230" y="306" font-size="11" font-weight="700" fill="#2563eb">ראש 1</text><text x="230" y="320" font-size="9.5" fill="#475569">עמ' 0–127</text>
    <text x="370" y="306" font-size="11" font-weight="700" fill="#27ae60">ראש 2</text><text x="370" y="320" font-size="9.5" fill="#475569">עמ' 128–255</text>
    <text x="510" y="306" font-size="11" font-weight="700" fill="#d35400">ראש 3</text><text x="510" y="320" font-size="9.5" fill="#475569">עמ' 256–383</text>
    <text x="650" y="306" font-size="11" font-weight="700" fill="#7c3aed">ראש 4</text><text x="650" y="320" font-size="9.5" fill="#475569">עמ' 384–511</text>
  </g>

  <!-- size annotation: one row highlighted (the word "station") -->
  <rect x="160" y="204" width="560" height="28" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="4,2"/>

  <!-- callout -->
  <rect x="120" y="344" width="580" height="48" rx="9" fill="#fff7ed" stroke="#d35400"/>
  <text x="410" y="364" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a" direction="rtl">השורות (מילים) נשארות שלמות בכל ראש — רק העמודות (פיצ'רים) נחתכות</text>
  <text x="410" y="382" text-anchor="middle" font-size="11" fill="#475569" direction="rtl">כל ראש מקבל את כל 7 המילים, אבל רק 128 העמודות שלו → מטריצה (7, 128)</text>
</svg>
