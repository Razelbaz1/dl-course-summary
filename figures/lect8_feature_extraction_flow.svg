<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" font-family="Segoe UI, Arial, sans-serif">
  <text x="440" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#1f3a68">Feature Extraction עם VGG16 — 2 שיטות</text>
  <foreignObject x="40" y="34" width="800" height="22">
    <div xmlns="http://www.w3.org/1999/xhtml" dir="rtl" style="box-sizing:border-box; width:100%; text-align:center; font-family:'Segoe UI',Arial,sans-serif; color:#6b7280; font-size:13px; line-height:1.4;">
      השיטה המהירה רצה ב-‎~0.5 שניות לאפוק. השיטה האיטית רצה ב-‎~12 שניות לאפוק.
    </div>
  </foreignObject>

  <defs>
    <marker id="arr4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <pattern id="frozen-pattern" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#1e3a8a" stroke-width="1.5"/>
    </pattern>
  </defs>

  <!-- ============== METHOD 1: FAST (top) ============== -->
  <foreignObject x="30" y="68" width="830" height="38">
    <div xmlns="http://www.w3.org/1999/xhtml" dir="rtl" style="box-sizing:border-box; font-family:'Segoe UI',Arial,sans-serif; color:#16a34a; line-height:1.4;">
      <div style="font-size:14px; font-weight:700;">שיטה 1: Fast Feature Extraction (בלי augmentation)</div>
      <div style="font-size:11px;">ה-conv_base רץ פעם אחת מראש על כל ה-dataset, ה-features נשמרים ב-RAM, ועליהם מאמנים classifier קטן.</div>
    </div>
  </foreignObject>

  <!-- Dataset images -->
  <rect x="30" y="115" width="80" height="60" fill="#dbeafe" stroke="#2563eb" rx="4"/>
  <text x="70" y="138" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">2000 תמונות</text>
  <text x="70" y="153" text-anchor="middle" font-size="10" fill="#1e40af">180×180×3</text>
  <text x="70" y="167" text-anchor="middle" font-size="10" fill="#1e40af">(ללא aug)</text>

  <!-- VGG16 frozen -->
  <rect x="135" y="105" width="130" height="80" fill="url(#frozen-pattern)" stroke="#1e40af" stroke-width="2" rx="4" opacity="0.25"/>
  <rect x="135" y="105" width="130" height="80" fill="none" stroke="#1e40af" stroke-width="2" rx="4"/>
  <text x="200" y="125" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">conv_base</text>
  <text x="200" y="142" text-anchor="middle" font-size="10" fill="#1e3a8a">VGG16 (ImageNet)</text>
  <text x="200" y="158" text-anchor="middle" font-size="10" font-weight="700" fill="#dc2626">❄ Frozen</text>
  <text x="200" y="175" text-anchor="middle" font-size="9" fill="#6b7280">predict() פעם אחת</text>

  <!-- Features cached -->
  <rect x="285" y="115" width="120" height="60" fill="#fef9c3" stroke="#ca8a04" rx="4"/>
  <text x="345" y="135" text-anchor="middle" font-size="11" font-weight="700" fill="#854d0e">train_features</text>
  <text x="345" y="152" text-anchor="middle" font-size="10" fill="#854d0e">(2000, 5, 5, 512)</text>
  <text x="345" y="168" text-anchor="middle" font-size="10" fill="#854d0e">numpy array · ב-RAM</text>

  <!-- Small classifier -->
  <rect x="425" y="105" width="130" height="80" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="4"/>
  <text x="490" y="125" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">Classifier קטן</text>
  <text x="490" y="142" text-anchor="middle" font-size="10" fill="#166534">Flatten → Dense 256</text>
  <text x="490" y="156" text-anchor="middle" font-size="10" fill="#166534">→ Dropout → Dense 1</text>
  <text x="490" y="174" text-anchor="middle" font-size="10" font-weight="700" fill="#15803d">🔥 Trainable</text>

  <!-- Result -->
  <rect x="575" y="115" width="120" height="60" fill="#22c55e" stroke="#15803d" rx="4"/>
  <text x="635" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">val_acc ≈ 98.4%</text>
  <text x="635" y="158" text-anchor="middle" font-size="11" fill="#fff">~0.5s / epoch ⚡</text>
  <text x="635" y="172" text-anchor="middle" font-size="10" fill="#dcfce7">overfit-prone</text>

  <!-- Cons -->
  <rect x="715" y="115" width="140" height="60" fill="#fef2f2" stroke="#dc2626" stroke-dasharray="4,3" rx="4"/>
  <text x="785" y="135" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">חיסרון:</text>
  <text x="785" y="151" text-anchor="middle" font-size="10" fill="#991b1b">לא ניתן לשלב</text>
  <text x="785" y="166" text-anchor="middle" font-size="10" fill="#991b1b">augmentation</text>

  <!-- Connections row 1 -->
  <g stroke="#475569" stroke-width="1.5" fill="none">
    <line x1="110" y1="145" x2="135" y2="145" marker-end="url(#arr4)"/>
    <line x1="265" y1="145" x2="285" y2="145" marker-end="url(#arr4)"/>
    <line x1="405" y1="145" x2="425" y2="145" marker-end="url(#arr4)"/>
    <line x1="555" y1="145" x2="575" y2="145" marker-end="url(#arr4)"/>
  </g>

  <!-- Divider -->
  <line x1="40" y1="220" x2="840" y2="220" stroke="#d1d5db" stroke-dasharray="6,4"/>

  <!-- ============== METHOD 2: WITH AUGMENTATION ============== -->
  <foreignObject x="30" y="232" width="830" height="40">
    <div xmlns="http://www.w3.org/1999/xhtml" dir="rtl" style="box-sizing:border-box; font-family:'Segoe UI',Arial,sans-serif; color:#9a3412; line-height:1.4;">
      <div style="font-size:14px; font-weight:700;">שיטה 2: Feature Extraction עם Augmentation (conv_base כשכבה ברשת)</div>
      <div style="font-size:11px;">ה-augmentation מייצר תמונות שונות בכל batch, ולכן אי-אפשר לשמור features מראש — ה-conv_base חייב לרוץ מחדש בכל epoch.</div>
    </div>
  </foreignObject>

  <!-- Aug + images per batch -->
  <rect x="30" y="285" width="100" height="80" fill="#dbeafe" stroke="#2563eb" rx="4"/>
  <text x="80" y="305" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">תמונות + aug</text>
  <text x="80" y="322" text-anchor="middle" font-size="10" fill="#1e40af">RandomFlip</text>
  <text x="80" y="336" text-anchor="middle" font-size="10" fill="#1e40af">RandomRotation</text>
  <text x="80" y="350" text-anchor="middle" font-size="10" fill="#1e40af">RandomZoom</text>
  <text x="80" y="360" text-anchor="middle" font-size="9" font-style="italic" fill="#6b7280">(שונה כל batch)</text>

  <!-- preprocess_input -->
  <rect x="150" y="295" width="90" height="60" fill="#fef3c7" stroke="#d97706" rx="4"/>
  <text x="195" y="316" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">preprocess_</text>
  <text x="195" y="330" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">input</text>
  <text x="195" y="346" text-anchor="middle" font-size="9" fill="#92400e">BGR + mean sub</text>

  <!-- conv_base frozen but in graph -->
  <rect x="260" y="285" width="130" height="80" fill="url(#frozen-pattern)" stroke="#1e40af" stroke-width="2" rx="4" opacity="0.25"/>
  <rect x="260" y="285" width="130" height="80" fill="none" stroke="#1e40af" stroke-width="2" rx="4"/>
  <text x="325" y="305" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">conv_base</text>
  <text x="325" y="322" text-anchor="middle" font-size="10" font-weight="700" fill="#dc2626">❄ trainable=False</text>
  <text x="325" y="340" text-anchor="middle" font-size="10" fill="#1e3a8a">חלק מהגרף החי</text>
  <text x="325" y="355" text-anchor="middle" font-size="9" fill="#6b7280">פעם בכל epoch</text>

  <!-- Trainable head -->
  <rect x="410" y="285" width="130" height="80" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="4"/>
  <text x="475" y="305" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">Head</text>
  <text x="475" y="322" text-anchor="middle" font-size="10" fill="#166534">Flatten → Dense 256</text>
  <text x="475" y="336" text-anchor="middle" font-size="10" fill="#166534">→ Dropout → Dense 1</text>
  <text x="475" y="355" text-anchor="middle" font-size="10" font-weight="700" fill="#15803d">🔥 Trainable</text>

  <!-- Result -->
  <rect x="560" y="295" width="120" height="60" fill="#22c55e" stroke="#15803d" rx="4"/>
  <text x="620" y="318" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">test_acc = 97.9%</text>
  <text x="620" y="338" text-anchor="middle" font-size="11" fill="#fff">~12s / epoch</text>
  <text x="620" y="351" text-anchor="middle" font-size="10" fill="#dcfce7">פחות overfit</text>

  <!-- Pros -->
  <rect x="700" y="295" width="150" height="60" fill="#f0fdf4" stroke="#16a34a" stroke-dasharray="4,3" rx="4"/>
  <text x="775" y="315" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">יתרון:</text>
  <text x="775" y="331" text-anchor="middle" font-size="10" fill="#166534">augmentation עובד</text>
  <text x="775" y="346" text-anchor="middle" font-size="10" fill="#166534">חזק יותר על val/test</text>

  <!-- Connections row 2 -->
  <g stroke="#475569" stroke-width="1.5" fill="none">
    <line x1="130" y1="325" x2="150" y2="325" marker-end="url(#arr4)"/>
    <line x1="240" y1="325" x2="260" y2="325" marker-end="url(#arr4)"/>
    <line x1="390" y1="325" x2="410" y2="325" marker-end="url(#arr4)"/>
    <line x1="540" y1="325" x2="560" y2="325" marker-end="url(#arr4)"/>
  </g>

  <!-- Comparison bar (foreignObject for clean RTL/LTR mixing) -->
  <foreignObject x="40" y="380" width="800" height="75">
    <div xmlns="http://www.w3.org/1999/xhtml" dir="rtl" style="box-sizing:border-box; width:100%; height:100%; padding:8px 14px; background:#fff7ed; border:1px solid #fb923c; border-radius:6px; font-family:'Segoe UI',Arial,sans-serif; color:#9a3412; font-size:11px; line-height:1.55;">
      <div style="font-size:12px; font-weight:700; margin-bottom:3px;">⚖ המסחר בין השיטות:</div>
      <div><strong>שיטה 1</strong> — מהירה מאוד (~0.5s/epoch), אך מועדת ל-overfit חזק (training loss קורס ל-0, val_loss מטפס). מתאימה לבדיקה מהירה של ה-classifier.</div>
      <div><strong>שיטה 2</strong> — איטית יותר (~12s/epoch, פי 24), אך יציבה יותר ומגיעה ל-97.9% test accuracy.</div>
    </div>
  </foreignObject>
</svg>
