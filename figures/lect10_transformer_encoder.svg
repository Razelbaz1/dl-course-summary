<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="t10i" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#475569"/></marker>
    <marker id="t10iP" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#d35400"/></marker>
  </defs>

  <text x="410" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a" direction="rtl">בלוק Transformer Encoder + הסיווג של IMDB</text>

  <!-- ===== LEFT: encoder block ===== -->
  <text x="230" y="58" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a" direction="rtl">בלוק ה-Encoder (מבפנים)</text>
  <rect x="100" y="68" width="260" height="338" rx="12" fill="#f8fbff" stroke="#1e3a8a" stroke-width="1.5"/>

  <!-- input -->
  <rect x="135" y="80" width="190" height="34" rx="7" fill="#dbeafe" stroke="#2563eb"/><text x="230" y="102" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">Embedding + PE (Seq×256)</text>
  <line x1="230" y1="114" x2="230" y2="128" stroke="#475569" stroke-width="1.4" marker-end="url(#t10i)"/>
  <!-- MHA -->
  <rect x="135" y="130" width="190" height="34" rx="7" fill="#fef3cd" stroke="#d35400"/><text x="230" y="152" text-anchor="middle" font-size="11" font-weight="700" fill="#d35400">Multi-Head Self-Attention</text>
  <line x1="230" y1="164" x2="230" y2="178" stroke="#475569" stroke-width="1.4" marker-end="url(#t10i)"/>
  <!-- add norm 1 -->
  <rect x="135" y="180" width="190" height="30" rx="7" fill="#e5e7eb" stroke="#94a3b8"/><text x="230" y="200" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">Add &amp; Norm</text>
  <line x1="230" y1="210" x2="230" y2="224" stroke="#475569" stroke-width="1.4" marker-end="url(#t10i)"/>
  <!-- FF -->
  <rect x="135" y="226" width="190" height="34" rx="7" fill="#fde8e8" stroke="#c0392b"/><text x="230" y="244" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c0392b">Feed-Forward</text><text x="230" y="256" text-anchor="middle" font-size="9" fill="#c0392b">Dense(relu) → Dense</text>
  <line x1="230" y1="260" x2="230" y2="274" stroke="#475569" stroke-width="1.4" marker-end="url(#t10i)"/>
  <!-- add norm 2 -->
  <rect x="135" y="276" width="190" height="30" rx="7" fill="#e5e7eb" stroke="#94a3b8"/><text x="230" y="296" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">Add &amp; Norm</text>
  <line x1="230" y1="306" x2="230" y2="320" stroke="#475569" stroke-width="1.4" marker-end="url(#t10i)"/>
  <!-- output -->
  <rect x="135" y="322" width="190" height="34" rx="7" fill="#dcfce7" stroke="#27ae60"/><text x="230" y="344" text-anchor="middle" font-size="11" font-weight="700" fill="#27ae60">Encoder output (Seq×256)</text>

  <!-- residual connections (orange, right side) -->
  <path d="M325 97 C 348 97 348 195 332 195" fill="none" stroke="#d35400" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#t10iP)"/>
  <path d="M325 195 C 348 195 348 291 332 291" fill="none" stroke="#d35400" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#t10iP)"/>
  <text x="372" y="150" text-anchor="middle" font-size="9" fill="#d35400" direction="rtl">residual</text>
  <text x="372" y="245" text-anchor="middle" font-size="9" fill="#d35400" direction="rtl">residual</text>

  <text x="230" y="388" text-anchor="middle" font-size="9.5" fill="#475569" direction="rtl">חיבורי residual (כמו ResNet) מייצבים את האימון</text>

  <!-- ===== RIGHT: full classifier ===== -->
  <text x="615" y="58" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a" direction="rtl">מודל הסיווג המלא</text>

  <g font-size="11" font-weight="700" text-anchor="middle">
    <rect x="510" y="74" width="210" height="30" rx="7" fill="#f1f5f9" stroke="#94a3b8"/><text x="615" y="94" fill="#475569">int tokens (Seq)</text>
    <rect x="510" y="116" width="210" height="30" rx="7" fill="#fef3cd" stroke="#d35400"/><text x="615" y="136" fill="#d35400">PositionalEmbedding</text>
    <rect x="510" y="158" width="210" height="32" rx="7" fill="#dcfce7" stroke="#27ae60" stroke-width="2"/><text x="615" y="178" fill="#27ae60">TransformerEncoder</text>
    <rect x="510" y="202" width="210" height="30" rx="7" fill="#dbeafe" stroke="#2563eb"/><text x="615" y="222" fill="#1e3a8a">GlobalMaxPooling1D</text>
    <rect x="510" y="244" width="210" height="30" rx="7" fill="#e5e7eb" stroke="#94a3b8"/><text x="615" y="264" fill="#475569">Dropout 0.5</text>
    <rect x="510" y="286" width="210" height="30" rx="7" fill="#dbeafe" stroke="#2563eb"/><text x="615" y="306" fill="#1e3a8a">Dense(1, sigmoid)</text>
  </g>
  <g stroke="#475569" stroke-width="1.4">
    <line x1="615" y1="104" x2="615" y2="115" marker-end="url(#t10i)"/>
    <line x1="615" y1="146" x2="615" y2="157" marker-end="url(#t10i)"/>
    <line x1="615" y1="190" x2="615" y2="201" marker-end="url(#t10i)"/>
    <line x1="615" y1="232" x2="615" y2="243" marker-end="url(#t10i)"/>
    <line x1="615" y1="274" x2="615" y2="285" marker-end="url(#t10i)"/>
  </g>
  <!-- link encoder block to TransformerEncoder box -->
  <path d="M360 339 C 440 339 440 174 508 174" fill="none" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#t10i)"/>

  <rect x="510" y="326" width="210" height="40" rx="8" fill="#dcfce7" stroke="#27ae60"/>
  <text x="615" y="344" text-anchor="middle" font-size="11" font-weight="700" fill="#27ae60" direction="rtl">חיובי / שלילי</text>
  <text x="615" y="360" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">Test acc: 0.883</text>

  <text x="615" y="392" text-anchor="middle" font-size="9.5" fill="#475569" direction="rtl">GlobalMaxPooling שולף את הפיצ'ר החזק ביותר מהרצף</text>
</svg>
