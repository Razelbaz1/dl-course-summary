<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" font-family="Segoe UI, Arial, sans-serif">
  <text x="390" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f3a68">חלוקת dataset של Kaggle Dogs vs Cats</text>
  <text x="390" y="50" text-anchor="middle" font-size="13" fill="#6b7280">מתוך 25,000 תמונות → נבחרו רק 4,000 לצורך הדגמת "small dataset"</text>

  <!-- Source -->
  <rect x="20" y="100" width="160" height="160" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2" rx="6"/>
  <text x="100" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">Kaggle 2013</text>
  <text x="100" y="148" text-anchor="middle" font-size="12" fill="#6b7280">dogs-vs-cats</text>
  <text x="100" y="172" text-anchor="middle" font-size="22" font-weight="700" fill="#1f3a68">25,000</text>
  <text x="100" y="190" text-anchor="middle" font-size="11" fill="#6b7280">תמונות במקור</text>
  <text x="100" y="220" text-anchor="middle" font-size="11" fill="#9ca3af">צפ': 12.5K cats</text>
  <text x="100" y="234" text-anchor="middle" font-size="11" fill="#9ca3af">12.5K dogs</text>

  <!-- Arrow to subset -->
  <line x1="180" y1="180" x2="220" y2="180" stroke="#1f3a68" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="200" y="172" text-anchor="middle" font-size="10" fill="#1f3a68">subset</text>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f3a68"/>
    </marker>
  </defs>

  <!-- Three split boxes: train/val/test -->
  <!-- TRAIN 2000 -->
  <rect x="240" y="80" width="260" height="80" fill="#dbeafe" stroke="#2563eb" stroke-width="2" rx="6"/>
  <text x="370" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#1f3a68">Train · 2,000</text>
  <text x="370" y="128" text-anchor="middle" font-size="12" fill="#1f3a68">cat.0 — cat.999  (1,000)</text>
  <text x="370" y="146" text-anchor="middle" font-size="12" fill="#1f3a68">dog.0 — dog.999  (1,000)</text>

  <!-- VALIDATION 1000 -->
  <rect x="240" y="170" width="260" height="80" fill="#fef9c3" stroke="#ca8a04" stroke-width="2" rx="6"/>
  <text x="370" y="198" text-anchor="middle" font-size="14" font-weight="700" fill="#854d0e">Validation · 1,000</text>
  <text x="370" y="218" text-anchor="middle" font-size="12" fill="#854d0e">cat.1000 — cat.1499  (500)</text>
  <text x="370" y="236" text-anchor="middle" font-size="12" fill="#854d0e">dog.1000 — dog.1499  (500)</text>

  <!-- TEST 2000 -->
  <rect x="240" y="260" width="260" height="80" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="6"/>
  <text x="370" y="288" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">Test · 2,000</text>
  <text x="370" y="308" text-anchor="middle" font-size="12" fill="#166534">cat.1500 — cat.2499  (1,000)</text>
  <text x="370" y="326" text-anchor="middle" font-size="12" fill="#166534">dog.1500 — dog.2499  (1,000)</text>

  <!-- Tree structure on the right -->
  <text x="540" y="105" font-size="13" font-weight="700" fill="#374151" font-family="Consolas, monospace">cats_vs_dogs_small/</text>
  <text x="558" y="125" font-size="12" fill="#1f3a68" font-family="Consolas, monospace">├── train/</text>
  <text x="578" y="140" font-size="11" fill="#1f3a68" font-family="Consolas, monospace">│   ├── cat/  (1000 jpg)</text>
  <text x="578" y="154" font-size="11" fill="#1f3a68" font-family="Consolas, monospace">│   └── dog/  (1000 jpg)</text>
  <text x="558" y="174" font-size="12" fill="#854d0e" font-family="Consolas, monospace">├── validation/</text>
  <text x="578" y="189" font-size="11" fill="#854d0e" font-family="Consolas, monospace">│   ├── cat/  (500 jpg)</text>
  <text x="578" y="203" font-size="11" fill="#854d0e" font-family="Consolas, monospace">│   └── dog/  (500 jpg)</text>
  <text x="558" y="223" font-size="12" fill="#166534" font-family="Consolas, monospace">└── test/</text>
  <text x="578" y="238" font-size="11" fill="#166534" font-family="Consolas, monospace">    ├── cat/  (1000 jpg)</text>
  <text x="578" y="252" font-size="11" fill="#166534" font-family="Consolas, monospace">    └── dog/  (1000 jpg)</text>

  <text x="640" y="290" font-size="11" fill="#6b7280" font-family="Consolas, monospace">image_dataset_</text>
  <text x="640" y="304" font-size="11" fill="#6b7280" font-family="Consolas, monospace">from_directory()</text>
  <text x="640" y="320" font-size="11" fill="#6b7280" font-family="Consolas, monospace">→ tf.data.Dataset</text>

  <!-- Footer note -->
  <text x="390" y="378" text-anchor="middle" font-size="12" fill="#6b7280">📁 שם תת-תיקייה = label (Keras מסיק אוטומטית: cat → 0, dog → 1)</text>
</svg>
