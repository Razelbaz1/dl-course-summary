<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="wSeq" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/><stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="wTgt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2ecc71"/><stop offset="100%" stop-color="#27ae60"/>
    </linearGradient>
  </defs>

  <text x="410" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">חיתוך חלונות זמן — timeseries_dataset_from_array()</text>
  <text x="410" y="45" text-anchor="middle" font-size="12" fill="#475569">דוגמת צעצוע: מהרצף 0..9, חלון באורך 3, מטרה = הערך הבא</text>

  <!-- Source sequence 0..9 -->
  <text x="755" y="80" text-anchor="end" font-size="12" font-weight="600" fill="#1e3a8a">הרצף המקורי</text>
  <g font-size="14" font-weight="700" text-anchor="middle">
    <rect x="65"  y="58" width="36" height="36" rx="5" fill="#dbeafe" stroke="#3b82f6"/><text x="83"  y="82" fill="#1e3a8a">0</text>
    <rect x="110" y="58" width="36" height="36" rx="5" fill="#dbeafe" stroke="#3b82f6"/><text x="128" y="82" fill="#1e3a8a">1</text>
    <rect x="155" y="58" width="36" height="36" rx="5" fill="#dbeafe" stroke="#3b82f6"/><text x="173" y="82" fill="#1e3a8a">2</text>
    <rect x="200" y="58" width="36" height="36" rx="5" fill="#dbeafe" stroke="#3b82f6"/><text x="218" y="82" fill="#1e3a8a">3</text>
    <rect x="245" y="58" width="36" height="36" rx="5" fill="#dbeafe" stroke="#3b82f6"/><text x="263" y="82" fill="#1e3a8a">4</text>
    <rect x="290" y="58" width="36" height="36" rx="5" fill="#dbeafe" stroke="#3b82f6"/><text x="308" y="82" fill="#1e3a8a">5</text>
    <rect x="335" y="58" width="36" height="36" rx="5" fill="#dbeafe" stroke="#3b82f6"/><text x="353" y="82" fill="#1e3a8a">6</text>
    <rect x="380" y="58" width="36" height="36" rx="5" fill="#dbeafe" stroke="#3b82f6"/><text x="398" y="82" fill="#1e3a8a">7</text>
    <rect x="425" y="58" width="36" height="36" rx="5" fill="#dbeafe" stroke="#3b82f6"/><text x="443" y="82" fill="#1e3a8a">8</text>
    <rect x="470" y="58" width="36" height="36" rx="5" fill="#dbeafe" stroke="#3b82f6"/><text x="488" y="82" fill="#1e3a8a">9</text>
  </g>

  <!-- windows -->
  <g font-size="13" font-weight="700" text-anchor="middle" fill="#fff">
    <!-- row 1: [0,1,2]->3 -->
    <rect x="65"  y="120" width="126" height="30" rx="5" fill="url(#wSeq)"/>
    <text x="83" y="140">0</text><text x="128" y="140">1</text><text x="173" y="140">2</text>
    <rect x="200" y="120" width="36" height="30" rx="5" fill="url(#wTgt)"/><text x="218" y="140">3</text>
    <!-- row 2 -->
    <rect x="110" y="156" width="126" height="30" rx="5" fill="url(#wSeq)"/>
    <text x="128" y="176">1</text><text x="173" y="176">2</text><text x="218" y="176">3</text>
    <rect x="245" y="156" width="36" height="30" rx="5" fill="url(#wTgt)"/><text x="263" y="176">4</text>
    <!-- row 3 -->
    <rect x="155" y="192" width="126" height="30" rx="5" fill="url(#wSeq)"/>
    <text x="173" y="212">2</text><text x="218" y="212">3</text><text x="263" y="212">4</text>
    <rect x="290" y="192" width="36" height="30" rx="5" fill="url(#wTgt)"/><text x="308" y="212">5</text>
    <!-- row 4 -->
    <rect x="200" y="228" width="126" height="30" rx="5" fill="url(#wSeq)"/>
    <text x="218" y="248">3</text><text x="263" y="248">4</text><text x="308" y="248">5</text>
    <rect x="335" y="228" width="36" height="30" rx="5" fill="url(#wTgt)"/><text x="353" y="248">6</text>
    <!-- row 5 (faded, "...") -->
    <rect x="245" y="264" width="126" height="30" rx="5" fill="url(#wSeq)" opacity="0.45"/>
    <text x="263" y="284" opacity="0.7">4</text><text x="308" y="284" opacity="0.7">5</text><text x="353" y="284" opacity="0.7">6</text>
    <rect x="380" y="264" width="36" height="30" rx="5" fill="url(#wTgt)" opacity="0.45"/><text x="398" y="284" opacity="0.7">7</text>
  </g>

  <!-- overlap highlight: shared cells [1,2] between rows 1 and 2 -->
  <rect x="106" y="116" width="89" height="74" rx="6" fill="none" stroke="#d35400" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="150" y="308" text-anchor="middle" font-size="11" font-weight="700" fill="#d35400">2 ערכים חוזרים</text>

  <!-- legend (right side) -->
  <rect x="470" y="120" width="295" height="118" rx="10" fill="#f8fbff" stroke="#c7dbf7"/>
  <text x="622" y="142" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">מקרא</text>
  <rect x="724" y="153" width="26" height="16" rx="3" fill="url(#wSeq)"/>
  <text x="712" y="166" text-anchor="end" font-size="12" fill="#0f172a">קלט — הרצף שנכנס למודל</text>
  <rect x="724" y="180" width="26" height="16" rx="3" fill="url(#wTgt)"/>
  <text x="712" y="193" text-anchor="end" font-size="12" fill="#0f172a">מטרה — הערך הבא לחיזוי</text>
  <rect x="724" y="207" width="26" height="16" rx="3" fill="none" stroke="#d35400" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="712" y="220" text-anchor="end" font-size="12" fill="#0f172a">חפיפה — כל חלון מוזז ב-1</text>

  <!-- params box: two single-language columns, middle-anchored -->
  <rect x="60" y="336" width="700" height="150" rx="10" fill="#eef4ff" stroke="#c7dbf7"/>
  <text x="410" y="360" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">הפרמטרים בבעיית חיזוי הטמפרטורה</text>
  <line x1="395" y1="372" x2="395" y2="452" stroke="#c7dbf7"/>
  <!-- code column (LTR, monospace) -->
  <g font-family="Consolas, monospace" font-size="13" fill="#1e3a8a" text-anchor="middle">
    <text x="225" y="392">sampling_rate = 6</text>
    <text x="225" y="416">sequence_length = 120</text>
    <text x="225" y="440">delay = 6 × (120+24−1)</text>
  </g>
  <!-- hebrew column (RTL, single-language) -->
  <g font-size="12" fill="#0f172a" text-anchor="middle">
    <text x="578" y="392">דגימה פעם בשעה</text>
    <text x="578" y="416">5 ימים = 120 שעות אחורה</text>
    <text x="578" y="440">המטרה: 24 שעות אחרי הרצף</text>
  </g>
  <text x="410" y="470" text-anchor="middle" font-size="11" fill="#475569">פיצול כרונולוגי (train → val → test) מונע data leakage</text>
</svg>
