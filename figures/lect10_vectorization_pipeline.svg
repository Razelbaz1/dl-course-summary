<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="t10b" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker>
  </defs>

  <text x="410" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a" direction="rtl">צינור הוקטוריזציה — מטקסט גולמי לטנזור מספרי</text>
  <text x="410" y="45" text-anchor="middle" font-size="12" fill="#475569" direction="rtl">כל השלבים שעושה שכבת TextVectorization של Keras</text>

  <!-- Step 1: raw -->
  <rect x="40" y="70" width="740" height="44" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="60" y="90" text-anchor="start" font-size="11" font-weight="700" fill="#475569" direction="rtl">1 · טקסט גולמי</text>
  <text x="410" y="99" text-anchor="middle" font-family="Consolas,monospace" font-size="12" fill="#0f172a">"Sunset came. I was staring at the México sky. Isn't it splendid??"</text>
  <line x1="410" y1="114" x2="410" y2="128" stroke="#2563eb" stroke-width="1.6" marker-end="url(#t10b)"/>

  <!-- Step 2: standardize -->
  <rect x="40" y="130" width="740" height="50" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="60" y="150" text-anchor="start" font-size="11" font-weight="700" fill="#2563eb" direction="rtl">2 · Standardization</text>
  <text x="602.5" y="150" text-anchor="middle" font-size="10" fill="#475569" direction="rtl">lowercase · הסרת פיסוק · אותיות מיוחדות → רגילות · (stemming)</text>
  <text x="410" y="170" text-anchor="middle" font-family="Consolas,monospace" font-size="12" fill="#0f172a">sunset came i was staring at the mexico sky isnt it splendid</text>
  <line x1="410" y1="180" x2="410" y2="194" stroke="#2563eb" stroke-width="1.6" marker-end="url(#t10b)"/>

  <!-- Step 3: tokenize -->
  <rect x="40" y="196" width="740" height="50" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="60" y="216" text-anchor="start" font-size="11" font-weight="700" fill="#2563eb" direction="rtl">3 · Tokenization</text>
  <text x="677.5" y="216" text-anchor="middle" font-size="10" fill="#475569" direction="rtl">פיצול ל-tokens (כאן: לפי מילים)</text>
  <g font-size="10" text-anchor="middle" fill="#1e3a8a">
    <rect x="150" y="224" width="48" height="18" rx="9" fill="#fff" stroke="#2563eb"/><text x="174" y="237">sunset</text>
    <rect x="202" y="224" width="42" height="18" rx="9" fill="#fff" stroke="#2563eb"/><text x="223" y="237">came</text>
    <rect x="248" y="224" width="24" height="18" rx="9" fill="#fff" stroke="#2563eb"/><text x="260" y="237">i</text>
    <rect x="276" y="224" width="36" height="18" rx="9" fill="#fff" stroke="#2563eb"/><text x="294" y="237">was</text>
    <rect x="316" y="224" width="60" height="18" rx="9" fill="#fff" stroke="#2563eb"/><text x="346" y="237">staring</text>
    <rect x="380" y="224" width="26" height="18" rx="9" fill="#fff" stroke="#2563eb"/><text x="393" y="237">at</text>
    <rect x="410" y="224" width="34" height="18" rx="9" fill="#fff" stroke="#2563eb"/><text x="427" y="237">the</text>
    <rect x="448" y="224" width="54" height="18" rx="9" fill="#fff" stroke="#2563eb"/><text x="475" y="237">mexico</text>
    <rect x="506" y="224" width="32" height="18" rx="9" fill="#fff" stroke="#2563eb"/><text x="522" y="237">...</text>
  </g>
  <line x1="410" y1="246" x2="410" y2="260" stroke="#2563eb" stroke-width="1.6" marker-end="url(#t10b)"/>

  <!-- Step 4: vocab index -->
  <rect x="40" y="262" width="740" height="50" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="60" y="282" text-anchor="start" font-size="11" font-weight="700" fill="#2563eb" direction="rtl">4 · Vocabulary indexing</text>
  <text x="655.0" y="282" text-anchor="middle" font-size="10" fill="#475569" direction="rtl">כל token → מספר · [0]=mask · [1]=OOV/UNK</text>
  <text x="410" y="302" text-anchor="middle" font-family="Consolas,monospace" font-size="13" fill="#0f172a">[ 3429,  872,  7,  93,  1501,  31,  2,  15761,  ... ]</text>
  <line x1="410" y1="312" x2="410" y2="326" stroke="#2563eb" stroke-width="1.6" marker-end="url(#t10b)"/>

  <!-- Step 5: vectorize -->
  <rect x="40" y="328" width="740" height="64" rx="8" fill="#dcfce7" stroke="#27ae60"/>
  <text x="60" y="348" text-anchor="start" font-size="11" font-weight="700" fill="#27ae60" direction="rtl">5 · ייצוג כוקטור</text>
  <text x="755" y="348" text-anchor="end" font-size="10" fill="#475569" direction="rtl">תלוי במשפחת המודל</text>
  <g font-size="10.5" fill="#0f172a">
    <text x="200" y="372" text-anchor="middle" font-weight="700" fill="#d35400">multi-hot / TF-IDF</text>
    <text x="200" y="387" text-anchor="middle" direction="rtl">ל-Bag-of-Words</text>
    <text x="615" y="372" text-anchor="middle" font-weight="700" fill="#2563eb">embedding (int → וקטור)</text>
    <text x="615" y="387" text-anchor="middle" direction="rtl">ל-Sequence / Transformer</text>
  </g>
  <line x1="408" y1="338" x2="408" y2="382" stroke="#94a3b8" stroke-dasharray="3,3"/>
</svg>
