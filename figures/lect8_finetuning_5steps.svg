<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" font-family="Segoe UI, Arial, sans-serif">
  <text x="440" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#1f3a68">Fine-Tuning — 5 השלבים הקפדניים</text>
  <foreignObject x="40" y="34" width="800" height="22">
    <div xmlns="http://www.w3.org/1999/xhtml" dir="rtl" style="box-sizing:border-box; width:100%; text-align:center; font-family:'Segoe UI',Arial,sans-serif; color:#6b7280; font-size:13px; line-height:1.4;">
      מתוך עמוד 47 של ה-PDF. תוצאה אחרי שלב 3 (Feature Extraction): 97.9% · תוצאה אחרי שלב 5 (Fine-Tuning): 97.7%.
    </div>
  </foreignObject>

  <defs>
    <marker id="arr5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f3a68"/>
    </marker>
    <pattern id="frozen5" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#1e3a8a" stroke-width="1.5"/>
    </pattern>
  </defs>

  <!-- Step 1 -->
  <g>
    <circle cx="80" cy="100" r="22" fill="#1f3a68"/>
    <text x="80" y="106" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">1</text>
    <foreignObject x="115" y="76" width="380" height="22">
      <div xmlns="http://www.w3.org/1999/xhtml" dir="rtl" style="font-family:'Segoe UI',Arial,sans-serif; color:#1f3a68; font-size:13px; font-weight:700;">
        בנייה — Custom Head מעל ה-conv_base המאומן
      </div>
    </foreignObject>
    <rect x="120" y="100" width="350" height="40" fill="#dcfce7" stroke="#16a34a" rx="4"/>
    <text x="295" y="118" text-anchor="middle" font-size="11" font-family="Consolas, monospace" fill="#166534">conv_base = VGG16(weights="imagenet", include_top=False)</text>
    <text x="295" y="133" text-anchor="middle" font-size="11" font-family="Consolas, monospace" fill="#166534">head: Flatten → Dense 256 → Dropout → Dense 1</text>
    <foreignObject x="600" y="100" width="260" height="40">
      <div xmlns="http://www.w3.org/1999/xhtml" dir="rtl" style="font-family:'Segoe UI',Arial,sans-serif; color:#6b7280; font-size:11px; line-height:1.45; text-align:center;">
        <div>📦 14.7M + 3.3M params</div>
        <div style="font-size:10px;">conv_base + head</div>
      </div>
    </foreignObject>
  </g>

  <!-- Arrow down 1->2 -->
  <line x1="80" y1="125" x2="80" y2="160" stroke="#1f3a68" stroke-width="2" marker-end="url(#arr5)"/>

  <!-- Step 2 -->
  <g>
    <circle cx="80" cy="180" r="22" fill="#1f3a68"/>
    <text x="80" y="186" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">2</text>
    <foreignObject x="115" y="156" width="380" height="22">
      <div xmlns="http://www.w3.org/1999/xhtml" dir="rtl" style="font-family:'Segoe UI',Arial,sans-serif; color:#1f3a68; font-size:13px; font-weight:700;">
        קפיאה — כל ה-conv_base מוגדר כ-frozen
      </div>
    </foreignObject>
    <rect x="120" y="180" width="350" height="40" fill="url(#frozen5)" stroke="#1e40af" rx="4" opacity="0.25"/>
    <rect x="120" y="180" width="350" height="40" fill="none" stroke="#1e40af" rx="4"/>
    <text x="295" y="198" text-anchor="middle" font-size="11" font-family="Consolas, monospace" fill="#1e3a8a">conv_base.trainable = False</text>
    <foreignObject x="120" y="202" width="350" height="20">
      <div xmlns="http://www.w3.org/1999/xhtml" dir="rtl" style="text-align:center; font-family:'Segoe UI',Arial,sans-serif; color:#1e3a8a; font-size:10px;">
        ⚠ חובה לפני <span dir="ltr" style="font-family:Consolas,monospace">model.compile()</span>!
      </div>
    </foreignObject>
    <foreignObject x="600" y="180" width="260" height="40">
      <div xmlns="http://www.w3.org/1999/xhtml" dir="rtl" style="font-family:'Segoe UI',Arial,sans-serif; color:#6b7280; font-size:11px; line-height:1.45; text-align:center;">
        <div>🧊 0 trainable weights</div>
        <div style="font-size:10px;">בתוך ה-conv_base</div>
      </div>
    </foreignObject>
  </g>

  <line x1="80" y1="205" x2="80" y2="240" stroke="#1f3a68" stroke-width="2" marker-end="url(#arr5)"/>

  <!-- Step 3 -->
  <g>
    <circle cx="80" cy="260" r="22" fill="#1f3a68"/>
    <text x="80" y="266" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">3</text>
    <foreignObject x="115" y="236" width="380" height="22">
      <div xmlns="http://www.w3.org/1999/xhtml" dir="rtl" style="font-family:'Segoe UI',Arial,sans-serif; color:#1f3a68; font-size:13px; font-weight:700;">
        אימון ה-head בלבד (זהו Feature Extraction)
      </div>
    </foreignObject>
    <rect x="120" y="260" width="350" height="40" fill="#fef9c3" stroke="#ca8a04" rx="4"/>
    <text x="295" y="278" text-anchor="middle" font-size="11" font-family="Consolas, monospace" fill="#854d0e">optimizer = RMSprop(lr=1e-3, default)</text>
    <foreignObject x="120" y="282" width="350" height="20">
      <div xmlns="http://www.w3.org/1999/xhtml" dir="rtl" style="text-align:center; font-family:'Segoe UI',Arial,sans-serif; color:#854d0e; font-size:10px;">
        50 epochs · רק ה-head לומד למפות features ל-cat/dog
      </div>
    </foreignObject>
    <foreignObject x="600" y="260" width="260" height="40">
      <div xmlns="http://www.w3.org/1999/xhtml" dir="rtl" style="font-family:'Segoe UI',Arial,sans-serif; line-height:1.45; text-align:center;">
        <div style="color:#166534; font-size:11px; font-weight:600;">⇐ test 97.9%</div>
        <div style="color:#6b7280; font-size:10px;">(זה השלב הקודם)</div>
      </div>
    </foreignObject>
  </g>

  <line x1="80" y1="285" x2="80" y2="320" stroke="#1f3a68" stroke-width="2" marker-end="url(#arr5)"/>

  <!-- Step 4 -->
  <g>
    <circle cx="80" cy="340" r="22" fill="#dc2626"/>
    <text x="80" y="346" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">4</text>
    <foreignObject x="115" y="316" width="380" height="22">
      <div xmlns="http://www.w3.org/1999/xhtml" dir="rtl" style="font-family:'Segoe UI',Arial,sans-serif; color:#9a3412; font-size:13px; font-weight:700;">
        הפשרה — Unfreeze ל-4 השכבות העליונות של ה-conv_base
      </div>
    </foreignObject>
    <rect x="120" y="340" width="350" height="40" fill="#fed7aa" stroke="#ea580c" rx="4"/>
    <text x="295" y="358" text-anchor="middle" font-size="11" font-family="Consolas, monospace" fill="#9a3412">conv_base.trainable = True</text>
    <text x="295" y="373" text-anchor="middle" font-size="11" font-family="Consolas, monospace" fill="#9a3412">for layer in conv_base.layers[:-4]: layer.trainable = False</text>
    <foreignObject x="600" y="340" width="260" height="40">
      <div xmlns="http://www.w3.org/1999/xhtml" dir="rtl" style="font-family:'Segoe UI',Arial,sans-serif; color:#6b7280; font-size:11px; line-height:1.45; text-align:center;">
        <div>🔓 4 שכבות עליונות</div>
        <div style="font-size:10px;">(Block 5 של VGG16)</div>
      </div>
    </foreignObject>
  </g>

  <line x1="80" y1="365" x2="80" y2="400" stroke="#1f3a68" stroke-width="2" marker-end="url(#arr5)"/>

  <!-- Step 5 -->
  <g>
    <circle cx="80" cy="420" r="22" fill="#22c55e"/>
    <text x="80" y="426" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">5</text>
    <foreignObject x="115" y="396" width="380" height="22">
      <div xmlns="http://www.w3.org/1999/xhtml" dir="rtl" style="font-family:'Segoe UI',Arial,sans-serif; color:#166534; font-size:13px; font-weight:700;">
        אימון משותף עם learning rate נמוך מאוד
      </div>
    </foreignObject>
    <rect x="120" y="420" width="350" height="40" fill="#dcfce7" stroke="#16a34a" rx="4"/>
    <text x="295" y="438" text-anchor="middle" font-size="11" font-family="Consolas, monospace" fill="#166534">RMSprop(learning_rate=<tspan font-weight="700">1e-5</tspan>)</text>
    <foreignObject x="120" y="442" width="350" height="20">
      <div xmlns="http://www.w3.org/1999/xhtml" dir="rtl" style="text-align:center; font-family:'Segoe UI',Arial,sans-serif; color:#166534; font-size:10px;">
        30 epochs · ה-top conv layers וה-head מתעדכנים יחד בעדינות
      </div>
    </foreignObject>
    <foreignObject x="600" y="420" width="260" height="40">
      <div xmlns="http://www.w3.org/1999/xhtml" dir="rtl" style="font-family:'Segoe UI',Arial,sans-serif; line-height:1.45; text-align:center;">
        <div style="color:#1e40af; font-size:11px; font-weight:700;">⇐ test 97.7%</div>
        <div style="color:#dc2626; font-size:10px;">−0.2 נקודות אחוז (ירידה!)</div>
      </div>
    </foreignObject>
  </g>

  <!-- Right side: Why low lr? Box (foreignObject — clean Hebrew/code bidi) -->
  <foreignObject x="500" y="80" width="370" height="225">
    <div xmlns="http://www.w3.org/1999/xhtml" dir="rtl" style="box-sizing:border-box; width:100%; height:100%; padding:10px 14px; background:#fff7ed; border:1px solid #fb923c; border-radius:6px; font-family:'Segoe UI',Arial,sans-serif; color:#9a3412; font-size:11px; line-height:1.45;">
      <div style="font-size:13px; font-weight:700; text-align:center; margin-bottom:6px;">למה lr = 1e-5 ולא 1e-3 הרגיל?</div>

      <div style="font-weight:700; margin-top:6px;">1. המשקלים כבר טובים</div>
      <div style="font-size:10.5px;">ה-conv_base כבר אומן על 1.4M תמונות ב-ImageNet. שינוי חזק יהרוס את ה-features שלמד (catastrophic forgetting).</div>

      <div style="font-weight:700; margin-top:6px;">2. ההתקדמות הנותרת קטנה</div>
      <div style="font-size:10.5px;">ה-conv_base כבר "מכיר" חתולים וכלבים מתוך ImageNet — נדרשת רק התאמה עדינה לדומיין הספציפי.</div>

      <div style="font-weight:700; margin-top:6px;">3. למה רק 4 שכבות עליונות?</div>
      <div style="font-size:10.5px;">השכבות התחתונות (Block 1-3) לומדות פיצ'רים גנריים — קצוות, מרקמים — שטובים לכל משימה. השכבות העליונות (Block 5) הן שלומדות פיצ'רים סמנטיים, ושם משתלם להתאים.</div>
    </div>
  </foreignObject>

  <!-- Comparison chart: in THIS run, fine-tuning hurt by 0.2pp -->
  <g>
    <rect x="500" y="320" width="370" height="140" fill="#f8fafc" stroke="#94a3b8" rx="6"/>
    <foreignObject x="510" y="328" width="350" height="20">
      <div xmlns="http://www.w3.org/1999/xhtml" dir="rtl" style="text-align:center; font-family:'Segoe UI',Arial,sans-serif; color:#1f3a68; font-size:13px; font-weight:700;">
        השוואת שני המודלים
      </div>
    </foreignObject>

    <line x1="520" y1="430" x2="850" y2="430" stroke="#475569" stroke-width="1.5"/>

    <!-- bar After step 3: 97.9% (HIGHER bar now) -->
    <rect x="540" y="372" width="80" height="58" fill="#16a34a" rx="3"/>
    <text x="580" y="362" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">97.9%</text>
    <foreignObject x="540" y="436" width="80" height="22">
      <div xmlns="http://www.w3.org/1999/xhtml" dir="rtl" style="text-align:center; font-family:'Segoe UI',Arial,sans-serif; line-height:1.3;">
        <div style="color:#166534; font-size:11px;">אחרי שלב 3</div>
        <div style="color:#6b7280; font-size:9.5px;">(feature extraction)</div>
      </div>
    </foreignObject>

    <!-- bar After step 5: 97.7% (LOWER bar now) -->
    <rect x="660" y="376" width="80" height="54" fill="#1f6fb5" rx="3"/>
    <text x="700" y="366" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">97.7%</text>
    <foreignObject x="660" y="436" width="80" height="22">
      <div xmlns="http://www.w3.org/1999/xhtml" dir="rtl" style="text-align:center; font-family:'Segoe UI',Arial,sans-serif; line-height:1.3;">
        <div style="color:#1e40af; font-size:11px;">אחרי שלב 5</div>
        <div style="color:#6b7280; font-size:9.5px;">(fine-tuning)</div>
      </div>
    </foreignObject>

    <!-- delta arrow: points DOWN (decrease) -->
    <path d="M 620 376 L 660 380" stroke="#dc2626" stroke-width="2" marker-end="url(#arr5)"/>
    <foreignObject x="755" y="378" width="80" height="42">
      <div xmlns="http://www.w3.org/1999/xhtml" dir="rtl" style="text-align:center; font-family:'Segoe UI',Arial,sans-serif; color:#dc2626; line-height:1.3;">
        <div style="font-size:11px; font-weight:700;">−0.2</div>
        <div style="font-size:10px;">נקודות (ירידה!)</div>
      </div>
    </foreignObject>
  </g>
</svg>
