<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 510" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="aL" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#475569"/></marker>
    <marker id="aLr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#c0392b"/></marker>
    <marker id="aLo" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#d35400"/></marker>
    <marker id="aLg" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#27ae60"/></marker>
    <marker id="aLb" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker>
  </defs>

  <text x="410" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a" direction="rtl">ארכיטקטורת LSTM — שני זיכרונות ושלושה שערים</text>

  <!-- evolution strip -->
  <g font-size="11" text-anchor="middle">
    <rect x="120" y="42" width="150" height="32" rx="8" fill="#e5e7eb" stroke="#9ca3af"/>
    <text x="195" y="62" fill="#475569" direction="rtl">SimpleRNN: רק state</text>
    <text x="300" y="63" font-size="15" fill="#9ca3af">→</text>
    <rect x="335" y="42" width="150" height="32" rx="8" fill="#dcfce7" stroke="#27ae60"/>
    <text x="410" y="62" fill="#27ae60" direction="rtl">+ carry (זיכרון ארוך)</text>
    <text x="515" y="63" font-size="15" fill="#9ca3af">→</text>
    <rect x="550" y="42" width="150" height="32" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="625" y="62" fill="#2563eb" direction="rtl">+ 3 שערים</text>
  </g>

  <!-- LTM rail (carry) -->
  <text x="410" y="104" text-anchor="middle" font-size="11" font-weight="700" fill="#27ae60" direction="rtl">מסילת carry — זיכרון ארוך טווח (LTM)</text>
  <line x1="70" y1="120" x2="748" y2="120" stroke="#27ae60" stroke-width="3" marker-end="url(#aLg)"/>
  <text x="60" y="124" text-anchor="end" font-size="12" font-weight="700" fill="#27ae60">c(t-1)</text>
  <text x="758" y="124" text-anchor="start" font-size="12" font-weight="700" fill="#27ae60">c(t)</text>
  <!-- ops on rail -->
  <circle cx="300" cy="120" r="15" fill="#fff" stroke="#c0392b" stroke-width="2"/><text x="300" y="125" text-anchor="middle" font-size="15" font-weight="700" fill="#c0392b">×</text>
  <circle cx="510" cy="120" r="15" fill="#fff" stroke="#27ae60" stroke-width="2"/><text x="510" y="126" text-anchor="middle" font-size="17" font-weight="700" fill="#27ae60">+</text>

  <!-- cell box -->
  <rect x="195" y="150" width="510" height="215" rx="14" fill="#f8fbff" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="410" y="173" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a" direction="rtl">תא LSTM בזמן t</text>

  <!-- gates -->
  <g text-anchor="middle">
    <rect x="254" y="240" width="92" height="58" rx="10" fill="#fde8e8" stroke="#c0392b" stroke-width="1.5"/>
    <text x="300" y="266" font-size="14" font-weight="700" fill="#c0392b">f_t</text>
    <text x="300" y="286" font-size="11" fill="#c0392b" direction="rtl">שכחה</text>

    <rect x="464" y="240" width="92" height="58" rx="10" fill="#fef3cd" stroke="#d35400" stroke-width="1.5"/>
    <text x="510" y="266" font-size="14" font-weight="700" fill="#d35400">i_t · k_t</text>
    <text x="510" y="286" font-size="11" fill="#d35400" direction="rtl">למידה</text>

    <rect x="599" y="240" width="92" height="58" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="645" y="266" font-size="14" font-weight="700" fill="#2563eb">o_t</text>
    <text x="645" y="286" font-size="11" fill="#2563eb" direction="rtl">פלט</text>
  </g>

  <!-- connections gate -> rail ops -->
  <line x1="300" y1="238" x2="300" y2="137" stroke="#c0392b" stroke-width="1.8" marker-end="url(#aLr)"/>
  <text x="312" y="200" text-anchor="start" font-size="10" fill="#c0392b" direction="rtl">מה לשכוח</text>
  <line x1="510" y1="238" x2="510" y2="137" stroke="#d35400" stroke-width="1.8" marker-end="url(#aLo)"/>
  <text x="522" y="200" text-anchor="start" font-size="10" fill="#d35400" direction="rtl">מה להוסיף</text>

  <!-- carry -> use (output gate reads updated carry) -->
  <line x1="645" y1="122" x2="645" y2="238" stroke="#27ae60" stroke-width="1.8" marker-end="url(#aLg)"/>
  <text x="657" y="185" text-anchor="start" font-size="10" fill="#27ae60" direction="rtl">הזיכרון המעודכן</text>

  <!-- use -> STM (new state/output) -->
  <line x1="645" y1="300" x2="645" y2="418" stroke="#2563eb" stroke-width="1.8" marker-end="url(#aLb)"/>

  <!-- STM rail -->
  <line x1="70" y1="420" x2="748" y2="420" stroke="#2563eb" stroke-width="3" marker-end="url(#aLb)"/>
  <text x="60" y="424" text-anchor="end" font-size="12" font-weight="700" fill="#2563eb">state(t-1)</text>
  <text x="758" y="424" text-anchor="start" font-size="12" font-weight="700" fill="#2563eb">state(t)</text>
  <text x="410" y="442" text-anchor="middle" font-size="11" font-weight="700" fill="#2563eb" direction="rtl">מסילת state / output — זיכרון קצר טווח (STM)</text>

  <!-- STM feeds the gates -->
  <line x1="300" y1="418" x2="300" y2="300" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="510" y1="418" x2="510" y2="300" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="3,3"/>

  <!-- input from bottom (between gates, crosses rail cleanly at x=410) -->
  <line x1="410" y1="462" x2="410" y2="300" stroke="#475569" stroke-width="1.6" marker-end="url(#aL)"/>
  <text x="420" y="458" text-anchor="start" font-size="11" font-weight="700" fill="#475569">input(t)</text>

  <!-- formula box (pure formula, no bidi) -->
  <rect x="150" y="478" width="520" height="28" rx="8" fill="#dcfce7" stroke="#27ae60"/>
  <text x="410" y="497" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#0f172a">c(t) = f_t × c(t-1) + i_t × k_t</text>
</svg>
