<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ar9e" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#475569"/></marker>
    <marker id="ar9eC" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#27ae60"/></marker>
    <marker id="ar9eB" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker>
  </defs>

  <text x="410" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a" direction="rtl">ארכיטקטורת LSTM — הוספת "מסוע זיכרון" ל-SimpleRNN</text>

  <!-- evolution strip -->
  <g font-size="11" text-anchor="middle">
    <rect x="120" y="44" width="150" height="34" rx="8" fill="#e5e7eb" stroke="#9ca3af"/>
    <text x="195" y="65" fill="#475569" direction="rtl">SimpleRNN: רק state</text>
    <text x="300" y="66" font-size="16" fill="#9ca3af">→</text>
    <rect x="335" y="44" width="150" height="34" rx="8" fill="#dcfce7" stroke="#27ae60"/>
    <text x="410" y="65" fill="#27ae60" direction="rtl">+ carry track (c)</text>
    <text x="515" y="66" font-size="16" fill="#9ca3af">→</text>
    <rect x="550" y="44" width="150" height="34" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="625" y="65" fill="#2563eb" direction="rtl">+ 3 שערים (gates)</text>
  </g>

  <!-- carry track (LTM) across top -->
  <line x1="90" y1="120" x2="730" y2="120" stroke="#27ae60" stroke-width="3" marker-end="url(#ar9eC)"/>
  <text x="80" y="124" text-anchor="end" font-size="12" fill="#27ae60" font-weight="700">c t-1</text>
  <text x="742" y="124" text-anchor="start" font-size="12" fill="#27ae60" font-weight="700">c t</text>
  <text x="410" y="108" text-anchor="middle" font-size="11" fill="#27ae60" font-weight="700" direction="rtl">carry track — זיכרון ארוך טווח (LTM)</text>

  <!-- main cell box -->
  <rect x="210" y="140" width="400" height="210" rx="14" fill="#f8fbff" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="410" y="160" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a" direction="rtl">תא LSTM בזמן t</text>

  <!-- gates -->
  <g text-anchor="middle">
    <!-- forget gate -->
    <circle cx="290" cy="235" r="32" fill="#fde8e8" stroke="#c0392b" stroke-width="1.5"/>
    <text x="290" y="231" font-size="13" font-weight="700" fill="#c0392b">f_t</text>
    <text x="290" y="248" font-size="10" fill="#c0392b" direction="rtl">Forget</text>
    <!-- input/learn gate -->
    <circle cx="410" cy="235" r="32" fill="#fef3cd" stroke="#d35400" stroke-width="1.5"/>
    <text x="410" y="231" font-size="13" font-weight="700" fill="#d35400">i_t·k_t</text>
    <text x="410" y="248" font-size="10" fill="#d35400" direction="rtl">Learn</text>
    <!-- output/use gate -->
    <circle cx="530" cy="235" r="32" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="530" y="231" font-size="13" font-weight="700" fill="#2563eb">o_t</text>
    <text x="530" y="248" font-size="10" fill="#2563eb" direction="rtl">Use</text>
  </g>

  <!-- connections from carry to forget, and learn to carry -->
  <line x1="290" y1="120" x2="290" y2="201" stroke="#c0392b" stroke-width="1.6" marker-end="url(#ar9e)"/>
  <line x1="410" y1="203" x2="410" y2="123" stroke="#d35400" stroke-width="1.6" marker-end="url(#ar9e)"/>
  <line x1="530" y1="123" x2="530" y2="201" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#ar9e)"/>

  <!-- state track (STM) across bottom -->
  <line x1="90" y1="395" x2="730" y2="395" stroke="#2563eb" stroke-width="3" marker-end="url(#ar9eB)"/>
  <text x="80" y="399" text-anchor="end" font-size="12" fill="#2563eb" font-weight="700">state t-1</text>
  <text x="742" y="399" text-anchor="start" font-size="12" fill="#2563eb" font-weight="700">state t</text>
  <text x="410" y="416" text-anchor="middle" font-size="11" fill="#2563eb" font-weight="700" direction="rtl">state / output — זיכרון קצר טווח (STM)</text>

  <!-- state into gates -->
  <line x1="290" y1="395" x2="290" y2="269" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="3,3"/>
  <line x1="530" y1="267" x2="530" y2="392" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ar9eB)"/>

  <!-- input from below -->
  <line x1="410" y1="450" x2="410" y2="269" stroke="#475569" stroke-width="1.6" marker-end="url(#ar9e)"/>
  <text x="410" y="468" text-anchor="middle" font-size="12" fill="#475569" font-weight="700">input t</text>

  <!-- carry update formula -->
  <rect x="60" y="476" width="700" height="20" rx="6" fill="#dcfce7" stroke="#27ae60"/>
  <text x="410" y="490" text-anchor="middle" font-size="12" fill="#1e3a8a" direction="rtl"><tspan font-family="Consolas,monospace" font-weight="700">c(t+1) = i_t · k_t  +  c_t · f_t</tspan>  —  שוכחים מידע לא רלוונטי (f) ומוסיפים מידע חדש (i·k)</text>
</svg>
