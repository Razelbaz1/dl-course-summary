<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="t10c" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#475569"/></marker>
  </defs>

  <text x="410" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a" direction="rtl">Bag-of-Words — קידוד multi-hot ו-N-grams</text>
  <text x="410" y="45" text-anchor="middle" font-size="12" fill="#475569" direction="rtl">המשפט: "the cat sat on the mat"</text>

  <!-- unigram set -->
  <text x="685.2" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#d35400" direction="rtl">Unigrams — מילים בודדות</text>
  <g font-size="12" text-anchor="middle" fill="#1e3a8a">
    <rect x="520" y="88" width="50" height="24" rx="12" fill="#fef3cd" stroke="#d35400"/><text x="545" y="104">the</text>
    <rect x="578" y="88" width="50" height="24" rx="12" fill="#fef3cd" stroke="#d35400"/><text x="603" y="104">cat</text>
    <rect x="636" y="88" width="50" height="24" rx="12" fill="#fef3cd" stroke="#d35400"/><text x="661" y="104">sat</text>
    <rect x="694" y="88" width="44" height="24" rx="12" fill="#fef3cd" stroke="#d35400"/><text x="716" y="104">on</text>
    <rect x="475" y="88" width="40" height="24" rx="12" fill="#fef3cd" stroke="#d35400"/><text x="495" y="104">mat</text>
  </g>
  <text x="650.0" y="132" text-anchor="middle" font-size="11" fill="#475569" direction="rtl">"the" מופיע פעמיים → עדיין ערך אחד ב-set</text>

  <!-- multi-hot vector -->
  <text x="628.0" y="166" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a" direction="rtl">וקטור multi-hot (באורך ה-vocabulary, ~20000)</text>
  <g font-size="12" text-anchor="middle" font-weight="700">
    <rect x="150" y="176" width="40" height="34" fill="#27ae60"/><text x="170" y="199" fill="#fff">1</text>
    <rect x="190" y="176" width="40" height="34" fill="#e5e7eb"/><text x="210" y="199" fill="#475569">0</text>
    <rect x="230" y="176" width="40" height="34" fill="#27ae60"/><text x="250" y="199" fill="#fff">1</text>
    <rect x="270" y="176" width="40" height="34" fill="#27ae60"/><text x="290" y="199" fill="#fff">1</text>
    <rect x="310" y="176" width="40" height="34" fill="#e5e7eb"/><text x="330" y="199" fill="#475569">0</text>
    <rect x="350" y="176" width="40" height="34" fill="#27ae60"/><text x="370" y="199" fill="#fff">1</text>
    <rect x="390" y="176" width="40" height="34" fill="#e5e7eb"/><text x="410" y="199" fill="#475569">0</text>
    <rect x="430" y="176" width="40" height="34" fill="#27ae60"/><text x="450" y="199" fill="#fff">1</text>
    <rect x="470" y="176" width="40" height="34" fill="#e5e7eb"/><text x="490" y="199" fill="#475569">0</text>
  </g>
  <g font-size="9" text-anchor="middle" fill="#475569">
    <text x="170" y="223">cat</text><text x="210" y="223">dog</text><text x="250" y="223">mat</text><text x="290" y="223">on</text>
    <text x="330" y="223">run</text><text x="370" y="223">sat</text><text x="410" y="223">swim</text><text x="450" y="223">the</text><text x="490" y="223">zoom</text>
  </g>
  <text x="335" y="245" text-anchor="middle" font-size="10" fill="#475569" direction="rtl">1 = המילה הופיעה · 0 = לא הופיעה</text>

  <!-- divider -->
  <line x1="40" y1="262" x2="780" y2="262" stroke="#c7dbf7"/>

  <!-- n-grams -->
  <text x="659.2" y="286" text-anchor="middle" font-size="13" font-weight="700" fill="#d35400" direction="rtl">N-grams — איך מחזירים סדר ל-BoW</text>

  <rect x="60" y="300" width="340" height="110" rx="10" fill="#fff7ed" stroke="#d35400"/>
  <text x="230" y="322" text-anchor="middle" font-size="12" font-weight="700" fill="#d35400">bag-of-2-grams</text>
  <text x="230" y="344" text-anchor="middle" font-size="10.5" font-family="Consolas,monospace" fill="#0f172a">{"the", "the cat", "cat",</text>
  <text x="230" y="362" text-anchor="middle" font-size="10.5" font-family="Consolas,monospace" fill="#0f172a">"cat sat", "sat", "sat on",</text>
  <text x="230" y="380" text-anchor="middle" font-size="10.5" font-family="Consolas,monospace" fill="#0f172a">"on", "on the", "the mat", "mat"}</text>
  <text x="230" y="400" text-anchor="middle" font-size="10" fill="#475569" direction="rtl">זוגות סמוכים → קצת סדר מקומי</text>

  <rect x="420" y="300" width="340" height="110" rx="10" fill="#fff7ed" stroke="#d35400"/>
  <text x="590" y="322" text-anchor="middle" font-size="12" font-weight="700" fill="#d35400">bag-of-3-grams</text>
  <text x="590" y="344" text-anchor="middle" font-size="10.5" font-family="Consolas,monospace" fill="#0f172a">{..., "the cat sat",</text>
  <text x="590" y="362" text-anchor="middle" font-size="10.5" font-family="Consolas,monospace" fill="#0f172a">"cat sat on", "sat on the",</text>
  <text x="590" y="380" text-anchor="middle" font-size="10.5" font-family="Consolas,monospace" fill="#0f172a">"on the mat", ...}</text>
  <text x="590" y="400" text-anchor="middle" font-size="10" fill="#475569" direction="rtl">שלשות → יותר הקשר (אך vocab גדל)</text>
</svg>
