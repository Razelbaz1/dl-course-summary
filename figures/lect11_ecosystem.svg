<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="e11a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/></marker>
  </defs>

  <text x="410" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a" direction="rtl">האקוסיסטם של Hugging Face</text>
  <text x="410" y="51" text-anchor="middle" font-size="12.5" fill="#475569" direction="rtl">"Democratizing AI" — כל הכלים לבנייה, שיתוף ושימוש במודלים</text>

  <!-- ===== center: the Hub ===== -->
  <circle cx="410" cy="250" r="78" fill="#1e3a8a"/>
  <text x="410" y="240" text-anchor="middle" font-size="22">🤗</text>
  <text x="410" y="266" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Hugging Face</text>
  <text x="410" y="286" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Hub</text>

  <!-- connectors -->
  <line x1="350" y1="200" x2="250" y2="138" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#e11a)"/>
  <line x1="470" y1="200" x2="570" y2="138" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#e11a)"/>
  <line x1="332" y1="250" x2="180" y2="250" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#e11a)"/>
  <line x1="488" y1="250" x2="640" y2="250" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#e11a)"/>
  <line x1="350" y1="300" x2="250" y2="362" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#e11a)"/>
  <line x1="470" y1="300" x2="570" y2="362" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#e11a)"/>

  <!-- ===== Transformers Library (top-left) ===== -->
  <rect x="70" y="96" width="190" height="62" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="165" y="120" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e3a8a">Transformers</text>
  <text x="165" y="139" text-anchor="middle" font-size="10.5" fill="#475569" direction="rtl">ספריית המודלים (BERT, GPT...)</text>
  <text x="165" y="152" text-anchor="middle" font-size="9.5" fill="#475569">PyTorch · TensorFlow · JAX</text>

  <!-- ===== Models + Datasets hosted (top-right) ===== -->
  <rect x="560" y="96" width="190" height="62" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="655" y="120" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e3a8a">Models · Datasets</text>
  <text x="655" y="139" text-anchor="middle" font-size="10.5" fill="#475569" direction="rtl">אחסון עם בקרת גרסאות Git</text>
  <text x="655" y="152" text-anchor="middle" font-size="9.5" fill="#475569" direction="rtl">טקסט · תמונה · אודיו</text>

  <!-- ===== Datasets lib (left) ===== -->
  <rect x="20" y="220" width="160" height="60" rx="10" fill="#eef4ff" stroke="#60a5fa"/>
  <text x="100" y="244" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Datasets</text>
  <text x="100" y="263" text-anchor="middle" font-size="10" fill="#475569" direction="rtl">טעינה ועיבוד דאטהסטים</text>

  <!-- ===== Evaluate (right) ===== -->
  <rect x="640" y="220" width="160" height="60" rx="10" fill="#eef4ff" stroke="#60a5fa"/>
  <text x="720" y="244" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Evaluate</text>
  <text x="720" y="263" text-anchor="middle" font-size="10" fill="#475569" direction="rtl">מדדי הערכת מודלים</text>

  <!-- ===== Spaces (bottom-left) ===== -->
  <rect x="70" y="362" width="190" height="62" rx="10" fill="#dcfce7" stroke="#27ae60"/>
  <text x="165" y="386" text-anchor="middle" font-size="13.5" font-weight="700" fill="#166534">Spaces</text>
  <text x="165" y="405" text-anchor="middle" font-size="10.5" fill="#475569" direction="rtl">אפליקציות הדגמה (web apps)</text>
  <text x="165" y="418" text-anchor="middle" font-size="9.5" fill="#475569">widgets</text>

  <!-- ===== Gradio (bottom-right) ===== -->
  <rect x="560" y="362" width="190" height="62" rx="10" fill="#dcfce7" stroke="#27ae60"/>
  <text x="655" y="386" text-anchor="middle" font-size="13.5" font-weight="700" fill="#166534">Gradio</text>
  <text x="655" y="405" text-anchor="middle" font-size="10.5" fill="#475569" direction="rtl">בניית ממשק להדגמת ML</text>

  <text x="410" y="450" text-anchor="middle" font-size="11" fill="#94a3b8" direction="rtl">+ ספריות נוספות: Simulate (סימולציה) ועוד</text>
</svg>
