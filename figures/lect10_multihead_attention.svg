<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 450" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="t10h" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#475569"/></marker>
  </defs>

  <text x="410" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a" direction="rtl">Multi-Head Attention — כמה "ראשים" במקביל</text>
  <text x="410" y="45" text-anchor="middle" font-size="12" fill="#475569" direction="rtl">מפצלים את ה-attention ל-h ראשים; כל ראש לומד אספקט אחר של אותה מילה</text>

  <!-- input -->
  <rect x="310" y="62" width="200" height="36" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="410" y="85" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Embedding + PE (Seq × d_model)</text>

  <!-- Q K V -->
  <g>
    <line x1="360" y1="98" x2="230" y2="120" stroke="#475569" stroke-width="1.3" marker-end="url(#t10h)"/>
    <line x1="410" y1="98" x2="410" y2="120" stroke="#475569" stroke-width="1.3" marker-end="url(#t10h)"/>
    <line x1="460" y1="98" x2="590" y2="120" stroke="#475569" stroke-width="1.3" marker-end="url(#t10h)"/>
    <rect x="180" y="122" width="100" height="32" rx="7" fill="#fef3cd" stroke="#d35400"/><text x="230" y="143" text-anchor="middle" font-family="Consolas,monospace" font-size="12" font-weight="700" fill="#d35400">Q = X·Wq</text>
    <rect x="360" y="122" width="100" height="32" rx="7" fill="#fef3cd" stroke="#d35400"/><text x="410" y="143" text-anchor="middle" font-family="Consolas,monospace" font-size="12" font-weight="700" fill="#d35400">K = X·Wk</text>
    <rect x="540" y="122" width="100" height="32" rx="7" fill="#fef3cd" stroke="#d35400"/><text x="590" y="143" text-anchor="middle" font-family="Consolas,monospace" font-size="12" font-weight="700" fill="#d35400">V = X·Wv</text>
  </g>

  <text x="633.5" y="180" text-anchor="middle" font-size="11" font-weight="700" fill="#2563eb" direction="rtl">מפצלים כל מטריצה ל-h=4 ראשים (לפי מימד d_model)</text>

  <!-- 4 heads -->
  <g font-size="11" text-anchor="middle" font-weight="700" fill="#fff">
    <rect x="70" y="196" width="150" height="58" rx="9" fill="#1e3a8a"/>
    <text x="145" y="220">head 1</text><text x="145" y="240" font-size="9" font-weight="400">Attention(Q₁,K₁,V₁)</text>
    <rect x="240" y="196" width="150" height="58" rx="9" fill="#2563eb"/>
    <text x="315" y="220">head 2</text><text x="315" y="240" font-size="9" font-weight="400">Attention(Q₂,K₂,V₂)</text>
    <rect x="410" y="196" width="150" height="58" rx="9" fill="#3b82f6"/>
    <text x="485" y="220">head 3</text><text x="485" y="240" font-size="9" font-weight="400">Attention(Q₃,K₃,V₃)</text>
    <rect x="580" y="196" width="150" height="58" rx="9" fill="#60a5fa"/>
    <text x="655" y="220">head 4</text><text x="655" y="240" font-size="9" font-weight="400">Attention(Q₄,K₄,V₄)</text>
  </g>
  <text x="400" y="276" text-anchor="middle" font-size="10" fill="#475569" direction="rtl">כל ראש (Seq × d_model/h) — מתמקד בקשר אחר (תחביר, נושא, זמן...)</text>

  <!-- concat -->
  <g>
    <line x1="145" y1="254" x2="300" y2="296" stroke="#475569" stroke-width="1.2" marker-end="url(#t10h)"/>
    <line x1="315" y1="254" x2="370" y2="296" stroke="#475569" stroke-width="1.2" marker-end="url(#t10h)"/>
    <line x1="485" y1="254" x2="440" y2="296" stroke="#475569" stroke-width="1.2" marker-end="url(#t10h)"/>
    <line x1="655" y1="254" x2="510" y2="296" stroke="#475569" stroke-width="1.2" marker-end="url(#t10h)"/>
  </g>
  <rect x="290" y="298" width="240" height="32" rx="7" fill="#e5e7eb" stroke="#94a3b8"/>
  <text x="410" y="319" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">concat(head₁ … head₄)</text>

  <!-- W0 -->
  <line x1="410" y1="330" x2="410" y2="352" stroke="#475569" stroke-width="1.4" marker-end="url(#t10h)"/>
  <rect x="300" y="354" width="220" height="34" rx="8" fill="#dcfce7" stroke="#27ae60"/>
  <text x="410" y="376" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">× W₀ → Multi-Head output</text>

  <!-- formula -->
  <rect x="120" y="402" width="580" height="40" rx="9" fill="#0f172a"/>
  <text x="410" y="427" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" font-weight="700" fill="#fbbf24">MultiHead(Q,K,V) = concat(head₁,…,headₕ)·W₀</text>
</svg>
