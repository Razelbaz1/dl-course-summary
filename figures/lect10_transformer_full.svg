<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 490" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="t10j" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#475569"/></marker>
    <marker id="t10jC" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#27ae60"/></marker>
  </defs>

  <text x="410" y="24" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a" direction="rtl">Transformer מלא — Encoder ו-Decoder (תרגום)</text>
  <text x="410" y="42" text-anchor="middle" font-size="11.5" fill="#475569" direction="rtl">"we love watermelons" → "אנחנו אוהבים אבטיחים"</text>

  <!-- ===== ENCODER (left) ===== -->
  <rect x="60" y="58" width="270" height="250" rx="12" fill="#eef4ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="195" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#2563eb">Encoder</text>
  <g font-size="11" font-weight="700" text-anchor="middle">
    <rect x="85" y="252" width="220" height="40" rx="7" fill="#fff" stroke="#94a3b8"/><text x="195" y="270" fill="#475569">&gt;SOS&gt; we love</text><text x="195" y="285" fill="#475569">watermelons &gt;EOS&gt;</text>
    <rect x="85" y="200" width="220" height="30" rx="7" fill="#fef3cd" stroke="#d35400"/><text x="195" y="220" fill="#d35400">Embedding + Positional</text>
    <rect x="85" y="138" width="220" height="46" rx="7" fill="#dbeafe" stroke="#2563eb"/><text x="195" y="157" fill="#1e3a8a">Encoder × N</text><text x="195" y="173" font-size="9.5" font-weight="400" fill="#475569">Self-Attention + Feed-Forward</text>
    <rect x="85" y="92" width="220" height="34" rx="7" fill="#dcfce7" stroke="#27ae60"/><text x="195" y="113" fill="#27ae60">Encoder Output</text>
  </g>
  <g stroke="#475569" stroke-width="1.4">
    <line x1="195" y1="252" x2="195" y2="231" marker-end="url(#t10j)"/>
    <line x1="195" y1="200" x2="195" y2="185" marker-end="url(#t10j)"/>
    <line x1="195" y1="138" x2="195" y2="127" marker-end="url(#t10j)"/>
  </g>

  <!-- ===== DECODER (right) ===== -->
  <rect x="430" y="58" width="320" height="250" rx="12" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/>
  <text x="590" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#27ae60">Decoder</text>
  <g font-size="10.5" font-weight="700" text-anchor="middle">
    <rect x="455" y="262" width="270" height="30" rx="6" fill="#fff" stroke="#94a3b8"/><text x="590" y="281" fill="#475569" direction="rtl">&gt;SOS&gt; אנחנו אוהבים + padding</text>
    <rect x="455" y="226" width="270" height="28" rx="6" fill="#fef3cd" stroke="#d35400"/><text x="590" y="245" fill="#d35400">Embedding + Positional</text>
    <rect x="455" y="190" width="270" height="28" rx="6" fill="#fde8e8" stroke="#c0392b"/><text x="590" y="209" fill="#c0392b">Masked Self-Attention</text>
    <rect x="455" y="154" width="270" height="28" rx="6" fill="#dbeafe" stroke="#2563eb"/><text x="590" y="173" fill="#1e3a8a">Cross-Attention (Q=dec, K,V=enc)</text>
    <rect x="455" y="118" width="270" height="26" rx="6" fill="#e5e7eb" stroke="#94a3b8"/><text x="590" y="135" fill="#475569">Feed-Forward + Add &amp; Norm</text>
    <rect x="455" y="84" width="270" height="26" rx="6" fill="#dcfce7" stroke="#27ae60"/><text x="590" y="101" fill="#27ae60">Linear → Softmax → token</text>
  </g>
  <g stroke="#475569" stroke-width="1.3">
    <line x1="590" y1="262" x2="590" y2="255" marker-end="url(#t10j)"/>
    <line x1="590" y1="226" x2="590" y2="219" marker-end="url(#t10j)"/>
    <line x1="590" y1="190" x2="590" y2="183" marker-end="url(#t10j)"/>
    <line x1="590" y1="154" x2="590" y2="145" marker-end="url(#t10j)"/>
    <line x1="590" y1="118" x2="590" y2="111" marker-end="url(#t10j)"/>
  </g>

  <!-- cross-attention link: encoder output -> decoder cross-attention -->
  <path d="M305 109 C 380 109 380 168 453 168" fill="none" stroke="#27ae60" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#t10jC)"/>
  <text x="378" y="103" text-anchor="middle" font-size="9" fill="#27ae60" direction="rtl">K, V</text>

  <!-- masked attention note -->
  <rect x="60" y="318" width="690" height="30" rx="7" fill="#fde8e8" stroke="#c0392b"/>
  <text x="405" y="338" text-anchor="middle" font-size="11" fill="#c0392b" direction="rtl"><tspan font-weight="700">Masked</tspan> = הפלט במיקום t תלוי רק במילים קודמות; ערכים מעל האלכסון → ∞− → softmax מאפס אותם (אין הצצה לעתיד)</text>

  <!-- inference strip -->
  <text x="612.0" y="372" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a" direction="rtl">Inference — אוטו-רגרסיבי, צעד-אחר-צעד (greedy)</text>
  <g font-size="10" text-anchor="middle">
    <rect x="70" y="382" width="160" height="56" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="150" y="400" font-weight="700" fill="#1e3a8a">Step 1</text><text x="150" y="416" fill="#475569" direction="rtl">קלט: &gt;SOS&gt;</text><text x="150" y="431" font-weight="700" fill="#27ae60" direction="rtl">פלט: אנחנו</text>
    <rect x="246" y="382" width="160" height="56" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="326" y="400" font-weight="700" fill="#1e3a8a">Step 2</text><text x="326" y="416" fill="#475569" direction="rtl">+ אנחנו</text><text x="326" y="431" font-weight="700" fill="#27ae60" direction="rtl">פלט: אוהבים</text>
    <rect x="422" y="382" width="160" height="56" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="502" y="400" font-weight="700" fill="#1e3a8a">Step 3</text><text x="502" y="416" fill="#475569" direction="rtl">+ אוהבים</text><text x="502" y="431" font-weight="700" fill="#27ae60" direction="rtl">פלט: אבטיחים</text>
    <rect x="598" y="382" width="160" height="56" rx="8" fill="#dcfce7" stroke="#27ae60"/>
    <text x="678" y="400" font-weight="700" fill="#1e3a8a">Step 4</text><text x="678" y="416" fill="#475569" direction="rtl">+ אבטיחים</text><text x="678" y="431" font-weight="700" fill="#c0392b" direction="rtl">פלט: &gt;EOS&gt; (עצור)</text>
  </g>
  <g stroke="#94a3b8" stroke-width="1.3">
    <line x1="230" y1="410" x2="245" y2="410" marker-end="url(#t10j)"/>
    <line x1="406" y1="410" x2="421" y2="410" marker-end="url(#t10j)"/>
    <line x1="582" y1="410" x2="597" y2="410" marker-end="url(#t10j)"/>
  </g>
  <text x="410" y="456" text-anchor="middle" font-size="10.5" fill="#475569" direction="rtl">בכל צעד מצרפים את הפלט הקודם כקלט — עד שמגיעים ל-&gt;EOS&gt;. (אימון: הכל בצעד אחד; inference: N צעדים)</text>
</svg>
