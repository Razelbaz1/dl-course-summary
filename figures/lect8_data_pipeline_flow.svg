<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480" font-family="Segoe UI, Arial, sans-serif">
  <text x="470" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#1f3a68" direction="rtl">זרימת נתונים ב-tf.data.Dataset — מ-NumPy ועד המודל</text>
  <text x="470" y="46" text-anchor="middle" font-size="13" fill="#6b7280" direction="rtl">הדוגמה מהמחברת: 1000 וקטורים אקראיים → batches → model</text>

  <defs>
    <marker id="arrPipe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <linearGradient id="ramGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="dsGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="batchGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
    <linearGradient id="modelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fecaca"/>
      <stop offset="100%" stop-color="#fca5a5"/>
    </linearGradient>
  </defs>

  <!-- ========== STAGE 1: NumPy in RAM ========== -->
  <g>
    <rect x="20" y="120" width="170" height="170" fill="url(#ramGrad)" stroke="#1e40af" stroke-width="2" rx="6"/>
    <text x="105" y="142" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">1. NumPy ב-RAM</text>
    <text x="105" y="162" text-anchor="middle" font-size="11" fill="#1e40af" font-family="Consolas, monospace">np.random.normal</text>
    <text x="105" y="176" text-anchor="middle" font-size="11" fill="#1e40af" font-family="Consolas, monospace">(size=(1000, 16))</text>

    <!-- Visual representation: matrix grid -->
    <g transform="translate(40, 200)">
      <rect x="0" y="0" width="130" height="60" fill="#fff" stroke="#1e40af" stroke-width="1.5"/>
      <!-- Row labels showing it's a tall matrix -->
      <text x="65" y="22" text-anchor="middle" font-size="10" fill="#1e40af" font-family="Consolas, monospace">[ [...16 cols...] ]</text>
      <text x="65" y="36" text-anchor="middle" font-size="10" fill="#1e40af" font-family="Consolas, monospace">[ [...16 cols...] ]</text>
      <text x="65" y="50" text-anchor="middle" font-size="11" fill="#9ca3af">‎... × 1000 rows</text>
    </g>
    <text x="105" y="278" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af" font-family="Consolas, monospace">shape (1000, 16)</text>
  </g>

  <!-- Arrow 1 with label -->
  <g>
    <line x1="195" y1="205" x2="240" y2="205" stroke="#475569" stroke-width="2" marker-end="url(#arrPipe)"/>
    <text x="217" y="195" text-anchor="middle" font-size="10" font-weight="700" fill="#475569" font-family="Consolas, monospace">from_</text>
    <text x="217" y="220" text-anchor="middle" font-size="10" font-weight="700" fill="#475569" font-family="Consolas, monospace">tensor_slices</text>
  </g>

  <!-- ========== STAGE 2: Dataset of 1000 elements ========== -->
  <g>
    <rect x="245" y="120" width="180" height="170" fill="url(#dsGrad)" stroke="#16a34a" stroke-width="2" rx="6"/>
    <text x="335" y="142" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">2. Dataset (lazy)</text>
    <text x="335" y="160" text-anchor="middle" font-size="10" fill="#166534">‎1000 elements עצמאיים</text>

    <!-- Mini grids -->
    <g transform="translate(260, 175)">
      <rect x="0" y="0" width="40" height="14" fill="#fff" stroke="#16a34a"/>
      <text x="20" y="11" text-anchor="middle" font-size="9" fill="#166534" font-family="Consolas, monospace">(16,)</text>

      <rect x="50" y="0" width="40" height="14" fill="#fff" stroke="#16a34a"/>
      <text x="70" y="11" text-anchor="middle" font-size="9" fill="#166534" font-family="Consolas, monospace">(16,)</text>

      <rect x="100" y="0" width="40" height="14" fill="#fff" stroke="#16a34a"/>
      <text x="120" y="11" text-anchor="middle" font-size="9" fill="#166534" font-family="Consolas, monospace">(16,)</text>

      <rect x="0" y="20" width="40" height="14" fill="#fff" stroke="#16a34a"/>
      <text x="20" y="31" text-anchor="middle" font-size="9" fill="#166534" font-family="Consolas, monospace">(16,)</text>

      <rect x="50" y="20" width="40" height="14" fill="#fff" stroke="#16a34a"/>
      <text x="70" y="31" text-anchor="middle" font-size="9" fill="#9ca3af">...</text>

      <rect x="100" y="20" width="40" height="14" fill="#fff" stroke="#16a34a"/>
      <text x="120" y="31" text-anchor="middle" font-size="9" fill="#9ca3af">...</text>
    </g>

    <text x="335" y="232" text-anchor="middle" font-size="10" fill="#166534">⏳ אף ערך לא נקרא עדיין</text>
    <text x="335" y="248" text-anchor="middle" font-size="10" fill="#166534">רק כשעוברים בלולאה</text>
    <text x="335" y="278" text-anchor="middle" font-size="11" font-weight="700" fill="#166534" font-family="Consolas, monospace">‎1000 × shape (16,)</text>
  </g>

  <!-- Arrow 2 -->
  <g>
    <line x1="430" y1="205" x2="475" y2="205" stroke="#475569" stroke-width="2" marker-end="url(#arrPipe)"/>
    <text x="452" y="200" text-anchor="middle" font-size="10" font-weight="700" fill="#475569" font-family="Consolas, monospace">.batch(32)</text>
  </g>

  <!-- ========== STAGE 3: Batched Dataset ========== -->
  <g>
    <rect x="480" y="120" width="180" height="170" fill="url(#batchGrad)" stroke="#ea580c" stroke-width="2" rx="6"/>
    <text x="570" y="142" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412">3. Batched Dataset</text>
    <text x="570" y="160" text-anchor="middle" font-size="10" fill="#9a3412">‎~32 batches</text>

    <!-- Mini batches: rectangles representing (32,16) -->
    <g transform="translate(495, 175)">
      <rect x="0" y="0" width="46" height="30" fill="#fff" stroke="#ea580c" stroke-width="1.5"/>
      <text x="23" y="14" text-anchor="middle" font-size="9" fill="#9a3412" font-family="Consolas, monospace">(32,</text>
      <text x="23" y="25" text-anchor="middle" font-size="9" fill="#9a3412" font-family="Consolas, monospace">16)</text>

      <rect x="55" y="0" width="46" height="30" fill="#fff" stroke="#ea580c" stroke-width="1.5"/>
      <text x="78" y="14" text-anchor="middle" font-size="9" fill="#9a3412" font-family="Consolas, monospace">(32,</text>
      <text x="78" y="25" text-anchor="middle" font-size="9" fill="#9a3412" font-family="Consolas, monospace">16)</text>

      <rect x="110" y="0" width="46" height="30" fill="#fff" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="3,2"/>
      <text x="133" y="19" text-anchor="middle" font-size="9" fill="#9a3412">...</text>
    </g>

    <text x="570" y="232" text-anchor="middle" font-size="10" fill="#9a3412">קיבץ כל ‎32 elements</text>
    <text x="570" y="248" text-anchor="middle" font-size="10" fill="#9a3412">למטריצה אחת</text>
    <text x="570" y="278" text-anchor="middle" font-size="11" font-weight="700" fill="#9a3412" font-family="Consolas, monospace">‎~32 × shape (32, 16)</text>
  </g>

  <!-- Arrow 3 -->
  <g>
    <line x1="665" y1="205" x2="710" y2="205" stroke="#475569" stroke-width="2" marker-end="url(#arrPipe)"/>
    <text x="687" y="200" text-anchor="middle" font-size="10" font-weight="700" fill="#475569" font-family="Consolas, monospace">model.fit</text>
  </g>

  <!-- ========== STAGE 4: Model ========== -->
  <g>
    <rect x="715" y="120" width="200" height="170" fill="url(#modelGrad)" stroke="#dc2626" stroke-width="2" rx="6"/>
    <text x="815" y="142" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">4. Model Training</text>
    <text x="815" y="160" text-anchor="middle" font-size="10" fill="#991b1b">batch בכל גרדיאנט-step</text>

    <!-- Mini neural net -->
    <g transform="translate(740, 180)" stroke="#991b1b" fill="#fff">
      <circle cx="10" cy="10" r="5"/>
      <circle cx="10" cy="30" r="5"/>
      <circle cx="10" cy="50" r="5"/>

      <circle cx="55" cy="20" r="5"/>
      <circle cx="55" cy="40" r="5"/>

      <circle cx="100" cy="30" r="5"/>

      <line x1="15" y1="10" x2="50" y2="20"/>
      <line x1="15" y1="10" x2="50" y2="40"/>
      <line x1="15" y1="30" x2="50" y2="20"/>
      <line x1="15" y1="30" x2="50" y2="40"/>
      <line x1="15" y1="50" x2="50" y2="20"/>
      <line x1="15" y1="50" x2="50" y2="40"/>
      <line x1="60" y1="20" x2="95" y2="30"/>
      <line x1="60" y1="40" x2="95" y2="30"/>
    </g>

    <text x="815" y="248" text-anchor="middle" font-size="10" fill="#991b1b">‎1 batch = 1 צעד</text>
    <text x="815" y="262" text-anchor="middle" font-size="10" fill="#991b1b">של mini-batch SGD</text>
    <text x="815" y="278" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">prediction + loss + step</text>
  </g>

  <!-- ============= LAZY CALLOUT (using foreignObject for native HTML/RTL handling) ============= -->
  <foreignObject x="20" y="320" width="450" height="155">
    <div xmlns="http://www.w3.org/1999/xhtml" dir="rtl" style="box-sizing:border-box; width:100%; height:100%; padding:10px 14px; background:#fffbeb; border:2px solid #f59e0b; border-radius:6px; font-family:'Segoe UI', Arial, sans-serif; color:#92400e; font-size:11px; line-height:1.45;">
      <div style="font-size:13px; font-weight:700; margin-bottom:6px;">🦥 Lazy Evaluation — הסוד של Dataset</div>
      <div>ה-Dataset הוא רק "מתכון" — לא טוען שום נתון עד שהוא נדרש.</div>
      <div>הקריאה האמיתית קורית רק בלולאה או ב-<span style="font-family:Consolas,monospace">model.fit()</span>.</div>
      <div style="font-weight:700; margin-top:8px;">💡 למה זה קריטי לתמונות:</div>
      <div dir="ltr" style="font-family:Consolas,monospace; text-align:right; margin-top:2px;">25,000 × 180 × 180 × 3 × 4 bytes ≈ 9.7 GB</div>
      <div>לא ייכנס ל-12 GB RAM של Colab Free!</div>
    </div>
  </foreignObject>

  <!-- ============= MAP CALLOUT (using foreignObject) ============= -->
  <foreignObject x="485" y="320" width="430" height="155">
    <div xmlns="http://www.w3.org/1999/xhtml" dir="rtl" style="box-sizing:border-box; width:100%; height:100%; padding:10px 14px; background:#eff6ff; border:2px solid #3b82f6; border-radius:6px; font-family:'Segoe UI', Arial, sans-serif; color:#1e40af; font-size:11px; line-height:1.45;">
      <div style="font-size:13px; font-weight:700; margin-bottom:6px;">🔧 .map() — transformation בדרך</div>
      <div dir="ltr" style="font-family:Consolas,monospace; text-align:right;">dataset.map(lambda x: tf.reshape(x, (4, 4)))</div>
      <div style="margin-top:4px;">פעולה ש"מתחברת" ל-pipeline — רצה בכל element בלולאה.</div>
      <div style="font-weight:700; margin-top:6px;">שימושים נפוצים:</div>
      <div><span style="font-family:Consolas,monospace">.map(preprocess_input)</span> — נרמול VGG16</div>
      <div><span style="font-family:Consolas,monospace">.map(augment)</span> — augmentation לפני batch</div>
      <div><span style="font-family:Consolas,monospace">.map(load_image)</span> — טעינת JPG מהדיסק</div>
    </div>
  </foreignObject>
</svg>
