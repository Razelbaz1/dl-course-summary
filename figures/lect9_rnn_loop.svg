<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="rnnCell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <marker id="ar9d" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="ar9dG" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#d35400"/>
    </marker>
  </defs>

  <text x="410" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a" direction="rtl">RNN = לולאה שמעבירה state בזמן</text>
  <text x="410" y="45" text-anchor="middle" font-size="12" fill="#475569" direction="rtl">הרשת עוברת על איברי הרצף אחד-אחד ושומרת "זיכרון" (state) ממה שראתה</text>

  <!-- folded version (left) -->
  <text x="140" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a" direction="rtl">מקופל (לולאה)</text>
  <rect x="100" y="120" width="80" height="80" rx="10" fill="url(#rnnCell)"/>
  <text x="140" y="166" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">RNN</text>
  <!-- self loop -->
  <path d="M 180 140 C 230 120 230 200 180 180" fill="none" stroke="#d35400" stroke-width="2" marker-end="url(#ar9dG)"/>
  <text x="218" y="164" font-size="11" fill="#d35400" font-weight="700">state</text>
  <!-- input arrow up -->
  <line x1="140" y1="240" x2="140" y2="202" stroke="#475569" stroke-width="1.6" marker-end="url(#ar9d)"/>
  <text x="140" y="258" text-anchor="middle" font-size="12" fill="#c0392b" font-weight="700">input_t</text>
  <!-- output arrow up -->
  <line x1="140" y1="118" x2="140" y2="92" stroke="#475569" stroke-width="1.6" marker-end="url(#ar9d)"/>
  <text x="140" y="288" text-anchor="middle" font-size="11" fill="#475569" direction="rtl">x</text>
  <text x="140" y="106" text-anchor="middle" font-size="11" fill="#27ae60" font-weight="700">output</text>

  <!-- equals -->
  <text x="250" y="170" text-anchor="middle" font-size="26" fill="#9ca3af">=</text>

  <!-- unrolled version (right) -->
  <text x="540" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a" direction="rtl">פרוס בזמן (unrolled)</text>
  <g>
    <!-- 3 cells -->
    <rect x="320" y="120" width="74" height="74" rx="10" fill="url(#rnnCell)"/><text x="357" y="163" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">RNN</text>
    <rect x="503" y="120" width="74" height="74" rx="10" fill="url(#rnnCell)"/><text x="540" y="163" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">RNN</text>
    <rect x="686" y="120" width="74" height="74" rx="10" fill="url(#rnnCell)"/><text x="723" y="163" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">RNN</text>

    <!-- state passing (orange) -->
    <line x1="394" y1="157" x2="503" y2="157" stroke="#d35400" stroke-width="2" marker-end="url(#ar9dG)"/>
    <line x1="577" y1="157" x2="686" y2="157" stroke="#d35400" stroke-width="2" marker-end="url(#ar9dG)"/>
    <line x1="290" y1="157" x2="318" y2="157" stroke="#d35400" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#ar9dG)"/>
    <text x="276" y="161" text-anchor="end" font-size="10" fill="#d35400">state=0</text>
    <text x="448" y="150" text-anchor="middle" font-size="10" fill="#d35400" font-weight="700">state_t</text>
    <text x="631" y="150" text-anchor="middle" font-size="10" fill="#d35400" font-weight="700">state_t</text>

    <!-- inputs up -->
    <line x1="357" y1="234" x2="357" y2="196" stroke="#475569" stroke-width="1.6" marker-end="url(#ar9d)"/>
    <line x1="540" y1="234" x2="540" y2="196" stroke="#475569" stroke-width="1.6" marker-end="url(#ar9d)"/>
    <line x1="723" y1="234" x2="723" y2="196" stroke="#475569" stroke-width="1.6" marker-end="url(#ar9d)"/>
    <text x="357" y="250" text-anchor="middle" font-size="11" fill="#c0392b" font-weight="700">input t-1</text>
    <text x="540" y="250" text-anchor="middle" font-size="11" fill="#c0392b" font-weight="700">input t</text>
    <text x="723" y="250" text-anchor="middle" font-size="11" fill="#c0392b" font-weight="700">input t+1</text>

    <!-- outputs up -->
    <line x1="357" y1="118" x2="357" y2="96" stroke="#475569" stroke-width="1.6" marker-end="url(#ar9d)"/>
    <line x1="540" y1="118" x2="540" y2="96" stroke="#475569" stroke-width="1.6" marker-end="url(#ar9d)"/>
    <line x1="723" y1="118" x2="723" y2="96" stroke="#475569" stroke-width="1.6" marker-end="url(#ar9d)"/>
    <text x="357" y="110" text-anchor="middle" font-size="10" fill="#27ae60" font-weight="700">output t-1</text>
    <text x="540" y="110" text-anchor="middle" font-size="10" fill="#27ae60" font-weight="700">output t</text>
    <text x="723" y="110" text-anchor="middle" font-size="10" fill="#27ae60" font-weight="700">output t+1</text>
  </g>

  <!-- pseudocode box -->
  <rect x="60" y="300" width="700" height="84" rx="10" fill="#0f172a"/>
  <text x="410" y="322" text-anchor="middle" font-size="12" font-weight="700" fill="#60a5fa" direction="rtl">הלב של RNN — לולאת for</text>
  <g font-family="Consolas, monospace" font-size="13" fill="#e5e7eb">
    <text x="80" y="345">state_t = 0</text>
    <text x="80" y="364">for input_t in input_sequence:</text>
    <text x="110" y="383"><tspan fill="#fbbf24">output_t</tspan> = activation(dot(W, input_t) + dot(U, state_t) + b);  <tspan fill="#fb923c">state_t = output_t</tspan></text>
  </g>
</svg>
