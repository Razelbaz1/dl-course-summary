<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 410" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="rnnCell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <marker id="ar9d" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#475569"/></marker>
    <marker id="ar9dG" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#d35400"/></marker>
  </defs>

  <text x="410" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a" direction="rtl">RNN = לולאה שמעבירה state בזמן</text>
  <text x="410" y="45" text-anchor="middle" font-size="12" fill="#475569" direction="rtl">הרשת עוברת על איברי הרצף אחד-אחד ושומרת "זיכרון" (state) ממה שראתה</text>

  <!-- ============ folded version (left) ============ -->
  <text x="140" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a" direction="rtl">מקופל (לולאה)</text>

  <!-- output (text above arrow) -->
  <text x="140" y="106" text-anchor="middle" font-size="11" fill="#27ae60" font-weight="700">output</text>
  <line x1="140" y1="134" x2="140" y2="114" stroke="#475569" stroke-width="1.6" marker-end="url(#ar9d)"/>
  <!-- cell -->
  <rect x="100" y="136" width="80" height="78" rx="10" fill="url(#rnnCell)"/>
  <text x="140" y="181" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">RNN</text>
  <!-- input (text below arrow) -->
  <line x1="140" y1="246" x2="140" y2="218" stroke="#475569" stroke-width="1.6" marker-end="url(#ar9d)"/>
  <text x="140" y="264" text-anchor="middle" font-size="12" fill="#c0392b" font-weight="700">input_t</text>
  <!-- self loop -->
  <path d="M 180 152 C 234 134 234 216 180 198" fill="none" stroke="#d35400" stroke-width="2" marker-end="url(#ar9dG)"/>
  <text x="244" y="178" text-anchor="start" font-size="11" fill="#d35400" font-weight="700">state</text>

  <!-- equals -->
  <text x="290" y="184" text-anchor="middle" font-size="26" fill="#9ca3af">=</text>

  <!-- ============ unrolled version (right) ============ -->
  <text x="575" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a" direction="rtl">פרוס בזמן (unrolled)</text>

  <!-- 3 cells, centers 405, 555, 705 -->
  <g>
    <rect x="368" y="136" width="74" height="74" rx="10" fill="url(#rnnCell)"/><text x="405" y="179" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">RNN</text>
    <rect x="518" y="136" width="74" height="74" rx="10" fill="url(#rnnCell)"/><text x="555" y="179" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">RNN</text>
    <rect x="668" y="136" width="74" height="74" rx="10" fill="url(#rnnCell)"/><text x="705" y="179" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">RNN</text>
  </g>

  <!-- state passing (orange) at mid height -->
  <line x1="442" y1="173" x2="518" y2="173" stroke="#d35400" stroke-width="2" marker-end="url(#ar9dG)"/>
  <line x1="592" y1="173" x2="668" y2="173" stroke="#d35400" stroke-width="2" marker-end="url(#ar9dG)"/>
  <line x1="334" y1="173" x2="366" y2="173" stroke="#d35400" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#ar9dG)"/>
  <text x="330" y="164" text-anchor="middle" font-size="10" fill="#d35400">state=0</text>
  <text x="480" y="165" text-anchor="middle" font-size="10" fill="#d35400" font-weight="700">state_t</text>
  <text x="630" y="165" text-anchor="middle" font-size="10" fill="#d35400" font-weight="700">state_t</text>

  <!-- outputs (text above arrows) -->
  <text x="405" y="106" text-anchor="middle" font-size="10" fill="#27ae60" font-weight="700">output t-1</text>
  <text x="555" y="106" text-anchor="middle" font-size="10" fill="#27ae60" font-weight="700">output t</text>
  <text x="705" y="106" text-anchor="middle" font-size="10" fill="#27ae60" font-weight="700">output t+1</text>
  <line x1="405" y1="134" x2="405" y2="114" stroke="#475569" stroke-width="1.6" marker-end="url(#ar9d)"/>
  <line x1="555" y1="134" x2="555" y2="114" stroke="#475569" stroke-width="1.6" marker-end="url(#ar9d)"/>
  <line x1="705" y1="134" x2="705" y2="114" stroke="#475569" stroke-width="1.6" marker-end="url(#ar9d)"/>

  <!-- inputs (text below arrows) -->
  <line x1="405" y1="246" x2="405" y2="212" stroke="#475569" stroke-width="1.6" marker-end="url(#ar9d)"/>
  <line x1="555" y1="246" x2="555" y2="212" stroke="#475569" stroke-width="1.6" marker-end="url(#ar9d)"/>
  <line x1="705" y1="246" x2="705" y2="212" stroke="#475569" stroke-width="1.6" marker-end="url(#ar9d)"/>
  <text x="405" y="264" text-anchor="middle" font-size="11" fill="#c0392b" font-weight="700">input t-1</text>
  <text x="555" y="264" text-anchor="middle" font-size="11" fill="#c0392b" font-weight="700">input t</text>
  <text x="705" y="264" text-anchor="middle" font-size="11" fill="#c0392b" font-weight="700">input t+1</text>

  <!-- pseudocode box -->
  <rect x="60" y="298" width="700" height="98" rx="10" fill="#0f172a"/>
  <text x="410" y="320" text-anchor="middle" font-size="12" font-weight="700" fill="#60a5fa" direction="rtl">הלב של RNN — לולאת for</text>
  <g font-family="Consolas, monospace" font-size="13" fill="#e5e7eb">
    <text x="80" y="345">state_t = 0</text>
    <text x="80" y="365">for input_t in input_sequence:</text>
    <text x="110" y="385"><tspan fill="#fbbf24">output_t</tspan> = activation(dot(W, input_t) + dot(U, state_t) + b);  <tspan fill="#fb923c">state_t = output_t</tspan></text>
  </g>
</svg>
