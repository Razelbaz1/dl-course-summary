<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="cubeF" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/><stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <marker id="ar9c" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <text x="380" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a" direction="rtl">צורת הנתונים: טנזור תלת-ממדי (256, 120, 14)</text>
  <text x="380" y="47" text-anchor="middle" font-size="12" fill="#475569" direction="rtl">כל batch שיוצא מה-dataset הוא tuple של (samples, targets)</text>

  <!-- 3D stack of sample slices -->
  <g>
    <!-- back slices (depth = batch of 256) -->
    <rect x="250" y="95" width="170" height="170" fill="#cdddfb" stroke="#2563eb" stroke-width="1"/>
    <rect x="240" y="105" width="170" height="170" fill="#bcd2fa" stroke="#2563eb" stroke-width="1"/>
    <rect x="230" y="115" width="170" height="170" fill="#a9c6f9" stroke="#2563eb" stroke-width="1"/>
    <!-- front slice -->
    <rect x="220" y="125" width="170" height="170" fill="url(#cubeF)" stroke="#1e3a8a" stroke-width="1.5"/>

    <!-- grid hints on front face: 14 cols -->
    <g stroke="#ffffff" stroke-opacity="0.35" stroke-width="0.8">
      <line x1="232" y1="125" x2="232" y2="295"/><line x1="244" y1="125" x2="244" y2="295"/>
      <line x1="256" y1="125" x2="256" y2="295"/><line x1="268" y1="125" x2="268" y2="295"/>
      <line x1="280" y1="125" x2="280" y2="295"/><line x1="292" y1="125" x2="292" y2="295"/>
      <line x1="304" y1="125" x2="304" y2="295"/><line x1="316" y1="125" x2="316" y2="295"/>
      <line x1="328" y1="125" x2="328" y2="295"/><line x1="340" y1="125" x2="340" y2="295"/>
      <line x1="352" y1="125" x2="352" y2="295"/><line x1="364" y1="125" x2="364" y2="295"/>
      <line x1="376" y1="125" x2="376" y2="295"/>
    </g>
  </g>

  <!-- dimension annotations -->
  <!-- batch (depth) -->
  <line x1="220" y1="110" x2="250" y2="80" stroke="#475569" stroke-width="1.4" marker-end="url(#ar9c)"/>
  <text x="200" y="95" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">256</text>
  <text x="170" y="78" text-anchor="middle" font-size="11" fill="#475569" direction="rtl">batches</text>

  <!-- timesteps (height) -->
  <line x1="205" y1="125" x2="205" y2="295" stroke="#475569" stroke-width="1.4" marker-start="url(#ar9c)" marker-end="url(#ar9c)"/>
  <text x="150" y="205" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">120</text>
  <text x="150" y="223" text-anchor="middle" font-size="11" fill="#475569" direction="rtl">שעות (timesteps)</text>

  <!-- features (width) -->
  <line x1="220" y1="310" x2="390" y2="310" stroke="#475569" stroke-width="1.4" marker-start="url(#ar9c)" marker-end="url(#ar9c)"/>
  <text x="305" y="330" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">14</text>
  <text x="305" y="348" text-anchor="middle" font-size="11" fill="#475569" direction="rtl">תכונות מז"א (features)</text>

  <!-- right side: meaning -->
  <rect x="470" y="110" width="250" height="180" rx="10" fill="#eef4ff" stroke="#c7dbf7"/>
  <text x="705" y="135" text-anchor="end" font-size="13" font-weight="700" fill="#1e3a8a" direction="rtl">מה כל ממד אומר</text>
  <text x="705" y="162" text-anchor="end" font-size="12" fill="#0f172a" direction="rtl"><tspan font-weight="700">256</tspan> — דגימות ב-batch אחד</text>
  <text x="705" y="186" text-anchor="end" font-size="12" fill="#0f172a" direction="rtl"><tspan font-weight="700">120</tspan> — נקודות זמן בכל דגימה</text>
  <text x="705" y="210" text-anchor="end" font-size="12" fill="#0f172a" direction="rtl"><tspan font-weight="700">14</tspan> — מדדים בכל נקודת זמן</text>
  <line x1="490" y1="226" x2="700" y2="226" stroke="#c7dbf7"/>
  <text x="705" y="248" text-anchor="end" font-size="12" fill="#27ae60" direction="rtl" font-weight="700">targets: (256,)</text>
  <text x="705" y="270" text-anchor="end" font-size="11" fill="#475569" direction="rtl">256 ערכי טמפרטורה — אחד לכל דגימה</text>

  <text x="380" y="382" text-anchor="middle" font-size="11" fill="#c0392b" direction="rtl">שימו לב: הדגימות מעורבבות (shuffle) — אך בתוך כל דגימה נקודות הזמן עוקבות.</text>
</svg>
