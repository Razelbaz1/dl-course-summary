<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 378" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="l11a" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker>
  </defs>

  <text x="430" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a" direction="rtl">מה קורה כשטוענים מודל?</text>
  <text x="430" y="51" text-anchor="middle" font-size="12.5" fill="#475569" direction="rtl">()from_pretrained — מה-checkpoint ועד מודל מוכן לשימוש</text>

  <!-- arrows first (under boxes) -->
  <g stroke="#2563eb" stroke-width="2" fill="none">
    <line x1="395" y1="110" x2="240" y2="148" marker-end="url(#l11a)"/>
    <line x1="465" y1="110" x2="620" y2="148" marker-end="url(#l11a)"/>
    <line x1="195" y1="196" x2="195" y2="228" marker-end="url(#l11a)"/>
    <line x1="195" y1="276" x2="195" y2="308" marker-end="url(#l11a)"/>
    <line x1="270" y1="251" x2="352" y2="251" marker-end="url(#l11a)"/>
    <line x1="430" y1="276" x2="430" y2="308" marker-end="url(#l11a)"/>
    <line x1="270" y1="331" x2="352" y2="331" marker-end="url(#l11a)"/>
    <line x1="508" y1="331" x2="588" y2="331" marker-end="url(#l11a)"/>
    <line x1="665" y1="196" x2="665" y2="308" marker-end="url(#l11a)"/>
  </g>

  <!-- side labels -->
  <text x="60" y="175" text-anchor="middle" font-size="11.5" font-weight="700" fill="#475569" direction="rtl">תצורת</text>
  <text x="60" y="190" text-anchor="middle" font-size="11.5" font-weight="700" fill="#475569" direction="rtl">המודל</text>
  <text x="800" y="175" text-anchor="middle" font-size="11.5" font-weight="700" fill="#d35400" direction="rtl">משקלי</text>
  <text x="800" y="190" text-anchor="middle" font-size="11.5" font-weight="700" fill="#d35400" direction="rtl">המודל</text>

  <!-- ===== boxes ===== -->
  <!-- Checkpoint -->
  <rect x="345" y="64" width="170" height="46" rx="9" fill="#1e3a8a"/>
  <text x="430" y="84" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">Checkpoint /</text>
  <text x="430" y="101" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">local folder</text>

  <!-- Config file -->
  <rect x="120" y="150" width="150" height="46" rx="9" fill="#dbeafe" stroke="#2563eb"/>
  <text x="195" y="170" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">Config file</text>
  <text x="195" y="187" text-anchor="middle" font-size="10" fill="#475569">config.json</text>

  <!-- Model file -->
  <rect x="590" y="150" width="150" height="46" rx="9" fill="#fde9d9" stroke="#d35400"/>
  <text x="665" y="170" text-anchor="middle" font-size="12.5" font-weight="700" fill="#9a3412">Model file</text>
  <text x="665" y="187" text-anchor="middle" font-size="10" fill="#475569">weights (.bin/.safetensors)</text>

  <!-- Config class -->
  <rect x="120" y="230" width="150" height="46" rx="9" fill="#dbeafe" stroke="#2563eb"/>
  <text x="195" y="250" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">Config class</text>
  <text x="195" y="267" text-anchor="middle" font-size="10" fill="#475569">BertConfig...</text>

  <!-- Model class -->
  <rect x="355" y="230" width="150" height="46" rx="9" fill="#dbeafe" stroke="#2563eb"/>
  <text x="430" y="250" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">Model class</text>
  <text x="430" y="267" text-anchor="middle" font-size="10" fill="#475569">BertModel...</text>

  <!-- Model config -->
  <rect x="120" y="310" width="150" height="46" rx="9" fill="#dbeafe" stroke="#2563eb"/>
  <text x="195" y="335" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">Model config</text>

  <!-- model instance -->
  <rect x="355" y="310" width="150" height="46" rx="9" fill="#dbeafe" stroke="#2563eb"/>
  <text x="430" y="329" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">model instance</text>
  <text x="430" y="346" text-anchor="middle" font-size="10" fill="#475569" direction="rtl">(משקלים אקראיים)</text>

  <!-- pretrained model -->
  <rect x="588" y="310" width="160" height="46" rx="9" fill="#dcfce7" stroke="#27ae60"/>
  <text x="668" y="329" text-anchor="middle" font-size="12.5" font-weight="700" fill="#166534">pretrained model</text>
  <text x="668" y="346" text-anchor="middle" font-size="10" fill="#475569" direction="rtl">(מוכן לשימוש)</text>
</svg>
