<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 410" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="fwd" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#1e3a8a"/></linearGradient>
    <linearGradient id="bwd" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f39c12"/><stop offset="100%" stop-color="#d35400"/></linearGradient>
    <marker id="ar9f" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1e3a8a"/></marker>
    <marker id="ar9fO" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#d35400"/></marker>
    <marker id="ar9fG" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#475569"/></marker>
  </defs>

  <text x="390" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a" direction="rtl">Bidirectional RNN — קריאה משני הכיוונים</text>
  <text x="390" y="45" text-anchor="middle" font-size="12" fill="#475569" direction="rtl">שתי שכבות recurrent: אחת קדימה, אחת אחורה — והייצוגים ממוזגים</text>

  <!-- merged output -->
  <rect x="290" y="68" width="200" height="34" rx="8" fill="#dcfce7" stroke="#27ae60"/>
  <text x="390" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60" direction="rtl">מיזוג (concatenate) → Dense</text>

  <!-- forward layer (blue) cells -->
  <g>
    <rect x="120" y="150" width="70" height="56" rx="9" fill="url(#fwd)"/><text x="155" y="183" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">→</text>
    <rect x="280" y="150" width="70" height="56" rx="9" fill="url(#fwd)"/><text x="315" y="183" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">→</text>
    <rect x="440" y="150" width="70" height="56" rx="9" fill="url(#fwd)"/><text x="475" y="183" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">→</text>
    <rect x="600" y="150" width="70" height="56" rx="9" fill="url(#fwd)"/><text x="635" y="183" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">→</text>
    <line x1="190" y1="178" x2="280" y2="178" stroke="#1e3a8a" stroke-width="2" marker-end="url(#ar9f)"/>
    <line x1="350" y1="178" x2="440" y2="178" stroke="#1e3a8a" stroke-width="2" marker-end="url(#ar9f)"/>
    <line x1="510" y1="178" x2="600" y2="178" stroke="#1e3a8a" stroke-width="2" marker-end="url(#ar9f)"/>
  </g>
  <text x="100" y="182" text-anchor="end" font-size="11" fill="#1e3a8a" font-weight="700" direction="rtl">קדימה</text>

  <!-- backward layer (orange) cells -->
  <g>
    <rect x="120" y="226" width="70" height="56" rx="9" fill="url(#bwd)"/><text x="155" y="259" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">←</text>
    <rect x="280" y="226" width="70" height="56" rx="9" fill="url(#bwd)"/><text x="315" y="259" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">←</text>
    <rect x="440" y="226" width="70" height="56" rx="9" fill="url(#bwd)"/><text x="475" y="259" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">←</text>
    <rect x="600" y="226" width="70" height="56" rx="9" fill="url(#bwd)"/><text x="635" y="259" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">←</text>
    <line x1="600" y1="254" x2="510" y2="254" stroke="#d35400" stroke-width="2" marker-end="url(#ar9fO)"/>
    <line x1="440" y1="254" x2="350" y2="254" stroke="#d35400" stroke-width="2" marker-end="url(#ar9fO)"/>
    <line x1="280" y1="254" x2="190" y2="254" stroke="#d35400" stroke-width="2" marker-end="url(#ar9fO)"/>
  </g>
  <text x="100" y="258" text-anchor="end" font-size="11" fill="#d35400" font-weight="700" direction="rtl">אחורה</text>

  <!-- merge arrows up to output -->
  <line x1="315" y1="150" x2="360" y2="104" stroke="#27ae60" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#ar9fG)"/>
  <line x1="475" y1="150" x2="420" y2="104" stroke="#27ae60" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#ar9fG)"/>

  <!-- inputs -->
  <g font-size="11" fill="#c0392b" font-weight="700" text-anchor="middle">
    <line x1="155" y1="320" x2="155" y2="284" stroke="#475569" stroke-width="1.4" marker-end="url(#ar9fG)"/>
    <line x1="315" y1="320" x2="315" y2="284" stroke="#475569" stroke-width="1.4" marker-end="url(#ar9fG)"/>
    <line x1="475" y1="320" x2="475" y2="284" stroke="#475569" stroke-width="1.4" marker-end="url(#ar9fG)"/>
    <line x1="635" y1="320" x2="635" y2="284" stroke="#475569" stroke-width="1.4" marker-end="url(#ar9fG)"/>
    <text x="155" y="336">x t-1</text><text x="315" y="336">x t</text><text x="475" y="336">x t+1</text><text x="635" y="336">x t+2</text>
  </g>

  <!-- bottom note -->
  <rect x="60" y="356" width="660" height="44" rx="8" fill="#fff5f5" stroke="#f3c0c0"/>
  <text x="700" y="375" text-anchor="end" font-size="12" fill="#c0392b" direction="rtl"><tspan font-weight="700">בחיזוי טמפרטורה זה לא תרם</tspan> — הסדר הכרונולוגי קריטי, ורצף הפוך נותן תוצאות גרועות יותר.</text>
  <text x="700" y="393" text-anchor="end" font-size="12" fill="#1e3a8a" direction="rtl"><tspan font-weight="700">אבל ב-NLP זה זוהר</tspan> — מילה מקבלת משמעות גם ממילים שיבואו אחריה (השיעור הבא).</text>
</svg>
