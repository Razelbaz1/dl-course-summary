<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="t10a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#475569"/></marker>
  </defs>

  <text x="410" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a" direction="rtl">שלוש גישות לטיפול בסדר המילים</text>
  <text x="410" y="45" text-anchor="middle" font-size="12" fill="#475569" direction="rtl">המשפט: "the cat sat on the mat" — מה עושים עם הסדר?</text>

  <!-- Panel 1: BoW -->
  <rect x="40" y="70" width="230" height="290" rx="12" fill="#fef3cd" stroke="#d35400" stroke-width="1.5"/>
  <text x="155" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#d35400">Bag-of-Words</text>
  <text x="155" y="118" text-anchor="middle" font-size="12" fill="#d35400" direction="rtl">מתעלם מהסדר</text>
  <text x="155" y="150" text-anchor="middle" font-size="11" fill="#475569" direction="rtl">המשפט הופך ל"שק" מילים</text>
  <g font-size="11" text-anchor="middle" fill="#1e3a8a">
    <rect x="60" y="162" width="55" height="22" rx="11" fill="#fff" stroke="#d35400"/><text x="87" y="177">the</text>
    <rect x="120" y="162" width="55" height="22" rx="11" fill="#fff" stroke="#d35400"/><text x="147" y="177">cat</text>
    <rect x="180" y="162" width="55" height="22" rx="11" fill="#fff" stroke="#d35400"/><text x="207" y="177">sat</text>
    <rect x="80" y="190" width="55" height="22" rx="11" fill="#fff" stroke="#d35400"/><text x="107" y="205">on</text>
    <rect x="140" y="190" width="55" height="22" rx="11" fill="#fff" stroke="#d35400"/><text x="167" y="205">mat</text>
  </g>
  <text x="155" y="240" text-anchor="middle" font-size="11" fill="#475569" direction="rtl">"cat sat" ≡ "sat cat"</text>
  <line x1="60" y1="252" x2="250" y2="252" stroke="#e6c98a"/>
  <text x="155" y="272" text-anchor="middle" font-size="11" font-weight="700" fill="#d35400" direction="rtl">כדי בכל זאת להחזיר סדר:</text>
  <text x="155" y="290" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">N-grams</text>
  <text x="155" y="312" text-anchor="middle" font-size="10" fill="#475569" direction="rtl">"the cat" כ-token אחד</text>
  <text x="155" y="340" text-anchor="middle" font-size="11" fill="#27ae60" direction="rtl">מהיר · מנצח כשמעט דאטה</text>

  <!-- Panel 2: RNN -->
  <rect x="295" y="70" width="230" height="290" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="410" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#2563eb">Recurrent (RNN)</text>
  <text x="410" y="118" text-anchor="middle" font-size="12" fill="#2563eb" direction="rtl">סדר מדויק, אחד-אחרי-השני</text>
  <g font-size="10" text-anchor="middle" fill="#fff">
    <rect x="315" y="150" width="44" height="26" rx="6" fill="#2563eb"/><text x="337" y="167">the</text>
    <rect x="367" y="150" width="44" height="26" rx="6" fill="#2563eb"/><text x="389" y="167">cat</text>
    <rect x="419" y="150" width="44" height="26" rx="6" fill="#2563eb"/><text x="441" y="167">sat</text>
    <rect x="471" y="150" width="44" height="26" rx="6" fill="#2563eb"/><text x="493" y="167">...</text>
  </g>
  <line x1="359" y1="163" x2="367" y2="163" stroke="#d35400" stroke-width="2" marker-end="url(#t10a)"/>
  <line x1="411" y1="163" x2="419" y2="163" stroke="#d35400" stroke-width="2" marker-end="url(#t10a)"/>
  <line x1="463" y1="163" x2="471" y2="163" stroke="#d35400" stroke-width="2" marker-end="url(#t10a)"/>
  <text x="410" y="200" text-anchor="middle" font-size="11" fill="#475569" direction="rtl">קורא מילה-מילה, שומר state</text>
  <text x="410" y="232" text-anchor="middle" font-size="11" font-weight="700" fill="#2563eb" direction="rtl">מעדיף Word-grams</text>
  <text x="410" y="258" text-anchor="middle" font-size="11" fill="#475569" direction="rtl">לומד את הסדר בעצמו</text>
  <text x="410" y="284" text-anchor="middle" font-size="11" fill="#475569" direction="rtl">(לא feature engineering ידני)</text>
  <text x="410" y="330" text-anchor="middle" font-size="11" fill="#c0392b" direction="rtl">איטי · vanishing gradient</text>

  <!-- Panel 3: Transformer -->
  <rect x="550" y="70" width="230" height="290" rx="12" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/>
  <text x="665" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#27ae60">Transformer</text>
  <text x="665" y="118" text-anchor="middle" font-size="12" fill="#27ae60" direction="rtl">גישה היברידית</text>
  <g font-size="10" text-anchor="middle" fill="#fff">
    <rect x="572" y="150" width="44" height="26" rx="6" fill="#27ae60"/><text x="594" y="167">the</text>
    <rect x="624" y="150" width="44" height="26" rx="6" fill="#27ae60"/><text x="646" y="167">cat</text>
    <rect x="676" y="150" width="44" height="26" rx="6" fill="#27ae60"/><text x="698" y="167">sat</text>
    <rect x="728" y="150" width="32" height="26" rx="6" fill="#27ae60"/><text x="744" y="167">...</text>
  </g>
  <!-- attention arcs (all-to-all) -->
  <path d="M594 150 Q646 128 698 150" fill="none" stroke="#d35400" stroke-width="1.3"/>
  <path d="M594 150 Q620 134 646 150" fill="none" stroke="#d35400" stroke-width="1.3"/>
  <path d="M646 150 Q672 134 698 150" fill="none" stroke="#d35400" stroke-width="1.3"/>
  <text x="665" y="200" text-anchor="middle" font-size="11" fill="#475569" direction="rtl">מסתכל על כל המילים בו-זמנית</text>
  <text x="665" y="226" text-anchor="middle" font-size="11" fill="#475569" direction="rtl">(self-attention)</text>
  <text x="665" y="258" text-anchor="middle" font-size="11" font-weight="700" fill="#27ae60" direction="rtl">+ positional encoding</text>
  <text x="665" y="280" text-anchor="middle" font-size="11" fill="#475569" direction="rtl">מזריק מידע על המיקום</text>
  <text x="665" y="330" text-anchor="middle" font-size="11" fill="#27ae60" direction="rtl">מקבילי · השיטה השולטת מ-2017</text>
</svg>
